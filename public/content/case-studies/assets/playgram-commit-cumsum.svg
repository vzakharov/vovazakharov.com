<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" role="img" aria-labelledby="ttl desc">
<title id="ttl">Units of work and merged pull requests across the Playgram Bubble-to-Next.js rebuild</title>
<desc id="desc">Two stacked charts sharing a timeline from the first commit on 6 March 2026 to 21 August 2026. The upper chart is cumulative units of work on main, reaching 1,287 — a gentle curve rising from 6.2 units a day to 8.2 at 25 April, when development moved into the cloud and every change started arriving as a branch and a review. The lower chart is units of work landed per week, in the forties before the switch and the seventies and eighties after it, at an unchanged median size of roughly 380 changed lines. Release milestones are marked: 4.0.0, the first production build, on 21 May; 4.1.0, the first workspace live, on 24 June; 4.2.0, the big cutover, on 3 July; 4.3.0, Bubble switched off, on 11 July; 4.4.0, credits and access control, on 31 July; and 4.4.3 on 10 August, after which the work was handed over to the team and the weekly figure falls by about two thirds.</desc>
