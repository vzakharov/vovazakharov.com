    src: images/domain-myriadworlds.webp
    text: 'myriadworlds.com: squatted'
  - id: worlds-8
    type: sticky
    updated: [2026-11-07T07:20:00.000Z, agent:lead]
    box: [5010, 1175, 330, blue]
    text: "A name for how many worlds fit in a link: Chrome takes 2,097,152 characters of URL (2 × 1024 × 1024), so after 'https://vovazakharov.com/island#' up to 10^2,097,120 numbers (~870 KB written out). The 'chromeplex'. Funny, if debatable. Its proper name: one hundred sesexagintasescentilliquinsexagintasescentillion (that one is 10^2,000,000)."
  - id: domain-urin-world
    type: image
    updated: [2026-11-07T09:35:00.000Z, agent:lead]
    box: [5000, 2210, 420]
    src: images/domain-urin-world.webp
    text: 'Vova, on unsquatted.com: "urin.world — or does it sound like something about urine? :)"'
  - id: worlds-11
    type: sticky
    updated: [2026-11-07T09:35:00.000Z, agent:lead]
    box: [5480, 2200, 330, yellow]
    text: 'Brainstorm, 7 Nov. "You''re in!" is the line Vova likes: you are in the game, and in world 150. urin.world reads as urine first (Urin is the word in German, Dutch, Swedish); ur.in ($8) loses the "world". youarein.world#150 reads right the first time; yourein.world is free too but can read "you rein". Also free: youarein.games, youreinworld.com. Taken: youarein.com, yourein.com'
  - id: names-free
    type: sticky
    updated: [2026-11-07T09:45:00.000Z, agent:lead]
    box: [4990, 2620, 330, green]
    text: 'Free, 7 Nov (~180 checked through unsquatted). .world: youarein, yourein, nowentering, greetingsfrom, postcardfrom, wakeupin, castawayon, strandedon, shipwrecked, arrivein, islandno, worldno, beammeto, setcoursefor, sendmeto, jumpto, chromeplex, myriads, myria, amyriad, googol, numbered, seeded, worldnumber, unmapped, archipela, fallinto, dropinto, fromorbit, drawyour, kidsmade, ourown, pickaworld, sibling, branching. .com: amyriadworlds, myriadofworlds, myriadisles, theinfiniteatlas, libraryofislands, fallintothemap, drawnfromorbit, islandfall, yourworldnumber, everyworldhasanumber, familyofworlds, youreinworld. Also myriadworlds.net / .games / .world, youarein.games'
  - id: names-taken
    type: sticky
    updated: [2026-11-07T09:45:00.000Z, agent:lead]
    box: [5350, 2620, 300, pink]
    text: 'Good, but taken. .world: welcometo, welcometothe, thisis, meet, meetthe, hello, hi, visit, enter, arrive, takemeto, nextstop, nowboarding, bonvoyage, wishyouwerehere, lostin, landon, goto, every, any, another, next, other, nth, countless, endless, infinite, number, seed, random, dice, drawn, the, a, one, planet, island, isle, myriad. .com: myriadworlds ($4,395), myriadworld, themyriadworlds, myriadislands, tenthousandworlds, worldseed, worldnumber, libraryofworlds, infiniteatlas, drawnworlds, worldfall, orbitfall, isleverse, chromeplex, amyriad, youarein, yourein. Also myriadworlds.org / .app'
  - id: names-dropped
    type: sticky
    updated: [2026-11-07T09:45:00.000Z, agent:lead]
    box: [5680, 2620, 300, yellow]
    text: 'Free, dropped by taste. urin.world: urine first (Urin in German, Dutch, Swedish). ur.in ($8): loses "world". yourein.world: can read "you rein"; youarein reads right the first time. beammeto / setcoursefor: a space game, not this one. byno, nowin, worldno: read badly. mapyoucanfallinto, worldsandtheirchildren: too long to say. papers.world is reserved by the registry'
  - id: worlds-10
    type: sticky
    updated: [2026-11-07T08:40:00.000Z, agent:lead]
    box: [5710, 1720, 300, blue]
    text: 'Vova: a .world name that reads as a sentence with the number after it, "<greeting>.world#150". Free on 7 Nov: youarein.world#150, nowentering.world#150, greetingsfrom.world#150, postcardfrom.world#150, wakeupin.world#150, castawayon.world#150, islandno.world#150, beammeto.world#150, setcoursefor.world#150, chromeplex.world, myriads.world. Taken: welcometo, thisis, meet, hello, visit, takemeto, every, another, number, seed .world; myriadworlds.com'
  - id: worlds-9
    type: sticky
    updated: [2026-11-07T07:20:00.000Z, agent:lead]
    box: [5420, 1480, 330, blue]
    text: 'Domains: myriadworlds.com is squatted ($4,395 on HugeDomains); amyriadworlds.com is free, $12/yr (Vova, via unsquatted.com).'
