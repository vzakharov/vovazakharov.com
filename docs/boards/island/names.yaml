  - id: short-youarein
    type: sticky
    updated: ['2026-11-07T10:05:00.000Z', 'agent:lead']
    box: [6230, 1620, 320, yellow]
    text: 'Shortlist 1 — youarein.world#150. For: "you''re in!", in the game and in world 150. Against (Vova): people will type yourein; unsure it reads as "you are in" at all; and it names no game — "have you played…?" what?'
  - id: short-atlas
    type: sticky
    updated: ['2026-11-07T10:05:00.000Z', 'agent:lead']
    box: [6585, 1620, 320, yellow]
    text: 'Shortlist 2 — theinfiniteatlas.com. For: says what the game is, an atlas with every world in it (Borges). Against (Vova): infiniteatlas.com, without "the", is taken since 2011'
  - id: short-myriad
    type: sticky
    updated: ['2026-11-07T10:05:00.000Z', 'agent:lead']
    box: [6940, 1620, 320, yellow]
    text: 'Shortlist 3 — amyriadworlds.com, the game named "A Myriad Worlds". For: the address is the name letter for letter. Against: said aloud, people type myriadworlds.com, taken since 2018'
  - id: short-seed
    type: sticky
    updated: ['2026-11-07T10:05:00.000Z', 'agent:lead']
    box: [6230, 560, 320, yellow]
    text: 'Shortlist 4 — seedaworld.com (Vova). For: a verb, "seed a world", which is what the number does, and a .com — "nothing beats a com". Free, $12/yr; seeda.world is taken'
  - id: names-free
    type: sticky
    updated: ['2026-11-07T10:05:00.000Z', 'agent:lead']
    box: [6230, 1880, 320, green]
    text: 'Free (of ~180 checked): youarein / nowentering / greetingsfrom / wakeupin / castawayon / chromeplex .world; theinfiniteatlas, libraryofislands, fallintothemap, myriadisles .com'
  - id: names-taken
    type: sticky
    updated: ['2026-11-07T10:05:00.000Z', 'agent:lead']
    box: [6585, 1880, 320, pink]
    text: 'Good, but taken: welcometo / thisis / meet / hello / another / infinite .world; myriadworlds, infiniteatlas, libraryofworlds, worldseed, chromeplex, youarein .com'
  - id: names-dropped
    type: sticky
    updated: ['2026-11-07T10:05:00.000Z', 'agent:lead']
    box: [6940, 1880, 320, yellow]
    text: 'Free, dropped: urin.world (urine), ur.in (no "world"), yourein.world ("you rein"), beammeto.world (a space game), mapyoucanfallinto.com (too long)'
  - id: worlds-10
    type: sticky
