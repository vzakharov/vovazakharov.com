<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 420" font-family="sans-serif">
  <rect width="1260" height="420" fill="#efe9dc"/>
  <defs>
    <style>
      .l { fill: #b4c283; } .m { fill: #8a9a5b; } .d { fill: #66753f; } .k { fill: #4b5830; }
      .c { stroke: #3d4728; stroke-width: 1.2; stroke-linejoin: round; }
      .t { font-size: 22px; fill: #3d4728; font-weight: 600; }
      .s { font-size: 14px; fill: #5a5a4a; }
      .sh { fill: #000; opacity: .12; }
    </style>
  </defs>

  <!-- 1 — плотный купол: блинц + водяная бомбочка, вид сбоку -->
  <g transform="translate(0,0)">
    <text x="20" y="34" class="t">1 · Купол</text>
    <text x="20" y="56" class="s">блинц + водяная бомбочка; гладкая гранёная спина</text>
    <ellipse cx="205" cy="330" rx="170" ry="14" class="sh"/>
    <!-- legs, behind the body -->
    <polygon class="k c" points="78,270 112,270 102,308 80,308"/><polyline class="c" fill="none" stroke-width="2.5" points="82,308 79,315"/><polyline class="c" fill="none" stroke-width="2.5" points="100,308 103,315"/>

    <polygon class="k c" points="148,276 182,276 174,312 152,312"/><polyline class="c" fill="none" stroke-width="2.5" points="154,312 151,319"/><polyline class="c" fill="none" stroke-width="2.5" points="172,312 175,319"/>

    <polygon class="k c" points="223,276 257,276 253,312 231,312"/><polyline class="c" fill="none" stroke-width="2.5" points="233,312 230,319"/><polyline class="c" fill="none" stroke-width="2.5" points="251,312 254,319"/>

    <polygon class="k c" points="288,270 322,270 320,306 298,306"/><polyline class="c" fill="none" stroke-width="2.5" points="300,306 297,313"/><polyline class="c" fill="none" stroke-width="2.5" points="318,306 321,313"/>
    <!-- body facets: ridge → belly -->
    <polygon class="m c" points="40,262 62,190 100,232"/>
    <polygon class="l c" points="62,190 120,140 100,232"/>
    <polygon class="m c" points="100,232 120,140 175,250"/>
    <polygon class="l c" points="120,140 200,118 175,250"/>
    <polygon class="m c" points="175,250 200,118 245,252"/>
    <polygon class="l c" points="200,118 280,132 245,252"/>
    <polygon class="m c" points="245,252 280,132 318,238"/>
    <polygon class="l c" points="280,132 338,176 318,238"/>
    <!-- head: blunt snout with mouth -->
    <polygon class="d c" points="318,238 338,176 372,214 362,248"/>
    <circle cx="366" cy="232" r="4" fill="#3d4728"/>
    <polygon class="d c" points="40,262 100,232 175,250 245,252 318,238 362,248 330,282 70,284"/>
  </g>

  <!-- 2 — кольца: сегменты-гармошка, у каждого пара ног -->
  <g transform="translate(420,0)">
    <text x="20" y="34" class="t">2 · Кольца</text>
    <text x="20" y="56" class="s">тело из четырёх колец, ноги из их углов; трубка-рот</text>
    <ellipse cx="205" cy="330" rx="175" ry="14" class="sh"/>
    <polygon class="k c" points="71,270 105,270 95,308 73,308"/><polyline class="c" fill="none" stroke-width="2.5" points="75,308 72,315"/><polyline class="c" fill="none" stroke-width="2.5" points="93,308 96,315"/>

    <polygon class="k c" points="143,278 177,278 169,314 147,314"/><polyline class="c" fill="none" stroke-width="2.5" points="149,314 146,321"/><polyline class="c" fill="none" stroke-width="2.5" points="167,314 170,321"/>

    <polygon class="k c" points="219,278 253,278 249,314 227,314"/><polyline class="c" fill="none" stroke-width="2.5" points="229,314 226,321"/><polyline class="c" fill="none" stroke-width="2.5" points="247,314 250,321"/>

    <polygon class="k c" points="288,270 322,270 320,306 298,306"/><polyline class="c" fill="none" stroke-width="2.5" points="300,306 297,313"/><polyline class="c" fill="none" stroke-width="2.5" points="318,306 321,313"/>
    <!-- four rings, tail to head, each a faceted band -->
    <polygon class="l c" points="40,250 52,178 112,150 120,240"/>
    <polygon class="d c" points="40,250 120,240 116,284 58,286"/>
    <polygon class="l c" points="118,240 112,150 190,134 194,246"/>
    <polygon class="d c" points="118,240 194,246 192,290 116,286"/>
    <polygon class="l c" points="192,246 190,134 266,140 268,244"/>
    <polygon class="d c" points="192,246 268,244 270,290 192,290"/>
    <polygon class="l c" points="266,244 266,140 326,168 334,236"/>
    <polygon class="d c" points="266,244 334,236 328,280 270,290"/>
    <!-- seams between rings read as raised ridges -->
    <polyline class="c" fill="none" stroke-width="3" points="112,150 118,240 116,286"/>
    <polyline class="c" fill="none" stroke-width="3" points="190,134 193,246 192,290"/>
    <polyline class="c" fill="none" stroke-width="3" points="266,140 267,244 270,290"/>
    <!-- head and mouth tube -->
    <polygon class="m c" points="326,168 362,196 366,240 334,236"/>
    <polygon class="d c" points="334,236 366,240 352,270 328,280"/>
    <polygon class="k c" points="362,206 384,212 384,226 364,230"/>
  </g>

  <!-- 3 — плюшевый, три четверти: видно объём и ноги с обеих сторон -->
  <g transform="translate(840,0)">
    <text x="20" y="34" class="t">3 · Плюшевый, ¾</text>
    <text x="20" y="56" class="s">широкий, ноги враскоряку; объём виден сверху</text>
    <ellipse cx="205" cy="322" rx="175" ry="30" class="sh"/>
    <!-- far legs -->
    <polygon class="k c" points="118,214 152,214 148,250 126,250"/><polyline class="c" fill="none" stroke-width="2.5" points="128,250 125,257"/><polyline class="c" fill="none" stroke-width="2.5" points="146,250 149,257"/>

    <polygon class="k c" points="187,210 221,210 217,246 195,246"/><polyline class="c" fill="none" stroke-width="2.5" points="197,246 194,253"/><polyline class="c" fill="none" stroke-width="2.5" points="215,246 218,253"/>

    <polygon class="k c" points="255,208 289,208 285,244 263,244"/><polyline class="c" fill="none" stroke-width="2.5" points="265,244 262,251"/><polyline class="c" fill="none" stroke-width="2.5" points="283,244 286,251"/>

    <polygon class="k c" points="315,210 349,210 345,246 323,246"/><polyline class="c" fill="none" stroke-width="2.5" points="325,246 322,253"/><polyline class="c" fill="none" stroke-width="2.5" points="343,246 346,253"/>
    <!-- back: top facets light, side facets dark -->
    <polygon class="l c" points="60,196 110,140 190,120 200,180"/>
    <polygon class="l c" points="200,180 190,120 280,118 286,176"/>
    <polygon class="l c" points="286,176 280,118 344,142 352,190"/>
    <polygon class="m c" points="60,196 200,180 196,240 76,250"/>
    <polygon class="m c" points="200,180 286,176 284,240 196,240"/>
    <polygon class="m c" points="286,176 352,190 344,236 284,240"/>
    <polygon class="d c" points="76,250 196,240 284,240 344,236 330,268 96,276"/>
    <!-- head, turned a little toward the viewer -->
    <polygon class="m c" points="344,142 384,170 388,216 352,190"/>
    <polygon class="d c" points="352,190 388,216 372,246 344,236"/>
    <circle cx="380" cy="214" r="4" fill="#3d4728"/>
    <!-- near legs, splayed toward the viewer -->
    <polygon class="k c" points="83,256 117,256 105,298 83,298"/><polyline class="c" fill="none" stroke-width="2.5" points="85,298 82,305"/><polyline class="c" fill="none" stroke-width="2.5" points="103,298 106,305"/>

    <polygon class="k c" points="161,262 195,262 187,304 165,304"/><polyline class="c" fill="none" stroke-width="2.5" points="167,304 164,311"/><polyline class="c" fill="none" stroke-width="2.5" points="185,304 188,311"/>

    <polygon class="k c" points="239,262 273,262 269,304 247,304"/><polyline class="c" fill="none" stroke-width="2.5" points="249,304 246,311"/><polyline class="c" fill="none" stroke-width="2.5" points="267,304 270,311"/>

    <polygon class="k c" points="309,256 343,256 343,298 321,298"/><polyline class="c" fill="none" stroke-width="2.5" points="323,298 320,305"/><polyline class="c" fill="none" stroke-width="2.5" points="341,298 344,305"/>
  </g>

  <text x="20" y="400" class="s">Голова справа везде. Цвет — лицевая сторона листа; изнанка нигде не видна.</text>
</svg>
