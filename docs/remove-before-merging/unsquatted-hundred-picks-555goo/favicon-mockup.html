<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Favicon mockup</title>
    <style>
      :root {
        --bg: #f5f5f0;
        --fg: #222;
        --dim: #6b6b66;
        --accent: #2f6b4f;
        --hair: #dcdcd4;
        --tile: #e9e9e2;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #171816;
          --fg: #e8e8e2;
          --dim: #9a9a92;
          --accent: #7fbf9a;
          --hair: #2e302c;
          --tile: #252723;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.5 system-ui,
          sans-serif;
        padding: 24px 16px;
      }
      h1 {
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim);
        font-weight: 600;
        margin: 0 0 4px;
      }
      p.note {
        color: var(--dim);
        margin: 0 0 20px;
        max-width: 60ch;
      }
      .cols {
        display: grid;
        gap: 40px;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid var(--hair);
      }
      li {
        display: grid;
        grid-template-columns: auto 1fr auto;
        column-gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid var(--hair);
      }
      .plain li {
        grid-template-columns: 1fr auto;
      }
      .ico {
        width: 22px;
        height: 22px;
        margin-top: 2px;
        grid-row: span 3;
      }
      .ico svg {
        width: 22px;
        height: 22px;
        display: block;
      }
      .mono .ico svg {
        stroke: var(--accent);
        fill: none;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .tiles .ico {
        border-radius: 6px;
        display: grid;
        place-items: center;
      }
      .tiles .ico svg {
        width: 15px;
        height: 15px;
        stroke: #fff;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .name {
        font:
          600 16px/1.3 ui-monospace,
          'JetBrains Mono',
          monospace;
      }
      .cat {
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 600;
      }
      .blurb {
        color: var(--dim);
        font-size: 14px;
      }
      .cat,
      .blurb {
        grid-column: -3 / -2;
      }
      .grab {
        grid-row: 1;
        grid-column: -2;
        text-align: right;
        font-size: 13px;
        color: var(--accent);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="cols">
      <section class="plain">
        <h1>Now</h1>
        <p class="note">As the list stands.</p>
        <ul id="plain"></ul>
      </section>
      <section class="mono">
        <h1>A · line glyphs, one ink</h1>
        <p class="note">
          Each name gets a drawn mark in the accent colour, no fill.
        </p>
        <ul id="mono"></ul>
      </section>
      <section class="tiles">
        <h1>B · coloured tiles</h1>
        <p class="note">Browser-tab style: a hue per name, white glyph.</p>
        <ul id="tiles"></ul>
      </section>
    </div>
    <script>
      const P = [
        [
          'weftfloat.com',
          'Weaving',
          'A thread that skips over the weave. A textile studio or a design newsletter.',
          210,
          '<path d="M3 7h18M3 12h18M3 17h18"/><path d="M8 4c0 3 2 3 2 8s-2 5-2 8"/>',
        ],
        [
          'lasttrick.com',
          'Card games',
          'The one that decides the hand. A card-game shop or a closing-deals newsletter.',
          350,
          '<rect x="6" y="3" width="12" height="18" rx="2"/><path d="M12 8l2.5 4L12 16l-2.5-4z"/>',
        ],
        [
          'fairyringlab.com',
          'Mycology',
          'Mushrooms in a circle, overnight. A mushroom grower or a mycology podcast.',
          25,
          '<circle cx="12" cy="12" r="8" stroke-dasharray="3 3.3"/><path d="M10 13a2 2 0 0 1 4 0zM12 13v3"/>',
        ],
        [
          'lampcabin.com',
          'Mining',
          'Where the miners’ lamps were charged. A hardware shop or a lighting studio.',
          40,
          '<path d="M9 3h6M10 3v3h4V3M8 6h8l-1 9H9z"/><path d="M10 18h4M11 21h2"/>',
        ],
        [
          'hoodandglove.com',
          'Falconry',
          'A falconer’s two tools. A falconry centre or a leather-goods brand.',
          15,
          '<path d="M6 21v-8a6 6 0 0 1 12 0v8"/><path d="M9 13h6"/>',
        ],
        [
          'strikeanddip.com',
          'Geology',
          'How a geologist pins a rock layer down. A field-geology school or a mapping tool.',
          190,
          '<path d="M3 17l18-6M3 12l18-6"/><path d="M12 4v16"/>',
        ],
        [
          'ashfallpost.com',
          'Volcano',
          'News from downwind of the eruption. A volcano newsletter or a geology podcast.',
          0,
          '<path d="M4 20l6-10h4l6 10z"/><path d="M11 7c-1-2 1-3 0-5M14 7c1-2-1-3 0-4"/>',
        ],
        [
          'typebarhouse.com',
          'Typewriter',
          'The arms that strike the letters. A typewriter repairer or a writing studio.',
          270,
          '<path d="M4 19h16M7 19l5-13 5 13"/><path d="M12 6V3"/>',
        ],
        [
          'nightglowlab.com',
          'Astronomy',
          'The faint light of the night sky. A dark-sky tour or a sleep product.',
          235,
          '<path d="M3 18c4-3 14-3 18 0"/><path d="M8 7h.01M15 5h.01M18 10h.01M11 11h.01"/>',
        ],
        [
          'timberfare.com',
          'Random pair',
          'Timber and fare. A forest café, a cabin-trip company.',
          110,
          '<path d="M12 3l6 9h-4l4 6H6l4-6H6z"/><path d="M12 18v3"/>',
        ],
      ];
      for (const [id, cls] of [['plain'], ['mono'], ['tiles']]) {
        const ul = document.getElementById(id);
        for (const [d, c, b, hue, g] of P) {
          const li = document.createElement('li');
          const ico =
            id === 'plain'
              ? ''
              : `<span class="ico" style="${id === 'tiles' ? `background:hsl(${hue} 45% 45%)` : ''}"><svg viewBox="0 0 24 24">${g}</svg></span>`;
          li.innerHTML = `${ico}<span class="name">${d}</span><a class="grab">grab →</a><span class="cat">${c}</span><span class="blurb">${b}</span>`;
          ul.append(li);
        }
      }
    </script>
  </body>
</html>
