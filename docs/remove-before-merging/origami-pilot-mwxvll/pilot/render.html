<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #e9e4da; overflow: hidden; }
      canvas { display: block; }
    </style>
    <script type="importmap">
      { "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

      const W = innerWidth, H = innerHeight;
      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xe9e4da);
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.35;

      const key = new THREE.DirectionalLight(0xfff4e6, 2.4);
      key.position.set(-1.2, 2.2, 1.6);
      key.castShadow = true;
      key.shadow.mapSize.set(4096, 4096);
      key.shadow.bias = -0.0004;
      key.shadow.normalBias = 0.002;
      key.shadow.radius = 3;
      const sc = key.shadow.camera;
      sc.left = sc.bottom = -1.5; sc.right = sc.top = 1.5; sc.near = 0.1; sc.far = 8;
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xdfe8ff, 0.6);
      fill.position.set(1.5, 0.8, -1.0);
      scene.add(fill);
      scene.add(new THREE.HemisphereLight(0xffffff, 0xb8ad9a, 0.5));

      // paper fibre texture
      const tex = (() => {
        const c = document.createElement("canvas");
        c.width = c.height = 512;
        const g = c.getContext("2d");
        const img = g.createImageData(512, 512);
        let s = 7;
        const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
        for (let i = 0; i < 512 * 512; i++) {
          const v = 235 + rnd() * 20;
          img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
          img.data[i * 4 + 3] = 255;
        }
        g.putImageData(img, 0, 0);
        g.globalAlpha = 0.05;
        for (let i = 0; i < 1500; i++) {
          g.strokeStyle = rnd() > 0.5 ? "#fff" : "#999";
          g.beginPath();
          const x = rnd() * 512, y = rnd() * 512, a = rnd() * 6.28, l = 4 + rnd() * 14;
          g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
        }
        const t = new THREE.CanvasTexture(c);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      })();

      const group = new THREE.Group();
      scene.add(group);
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(20, 20),
        new THREE.ShadowMaterial({ opacity: 0.28 }),
      );
      ground.receiveShadow = true;
      scene.add(ground);

      const camera = new THREE.PerspectiveCamera(30, W / H, 0.01, 50);

      window.show = ({ model, view, colors }) => {
        group.clear();
        const front = new THREE.MeshStandardMaterial({ color: colors?.front ?? 0xc8372d, roughness: 0.82, map: tex, side: THREE.FrontSide });
        const back = new THREE.MeshStandardMaterial({ color: colors?.back ?? 0xf3efe6, roughness: 0.88, map: tex, side: THREE.BackSide });
        const lineMat = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.18 });
        // world: x right, y = model y, z = up. three: y up. map (x, y, z) -> (x, z, -y)
        const toThree = ([x, y, z]) => new THREE.Vector3(x, z, -y);
        let minZ = Infinity;
        for (const p of model.pieces) {
          const pos = [], uv = [];
          const n = p.world.length;
          // fan triangulation, oriented by paper winding so FrontSide is the paper's front
          for (let i = 1; i < n - 1; i++) {
            for (const k of [0, i, i + 1]) {
              const v = toThree(p.world[k]);
              pos.push(v.x, v.y, v.z);
              uv.push(p.paper[k][0] * 3, p.paper[k][1] * 3);
              minZ = Math.min(minZ, v.y);
            }
          }
          const geo = new THREE.BufferGeometry();
          geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
          geo.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
          geo.computeVertexNormals();
          // paper polygon is CCW in paper coords; the world mapping is a proper
          // rotation when the front faces up, so CCW from above = front side.
          // The (x,y,z)->(x,z,-y) map is a proper rotation, so winding carries over.
          for (const mat of [front, back]) {
            const m = new THREE.Mesh(geo, mat);
            m.castShadow = true;
            m.receiveShadow = true;
            group.add(m);
          }
          const pts = p.world.map(toThree);
          pts.push(pts[0]);
          group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat));
        }
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = minZ - 0.0015;

        const box = new THREE.Box3().setFromObject(group);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3()).length();
        const az = ((view?.az ?? -35) * Math.PI) / 180, el = ((view?.el ?? 35) * Math.PI) / 180;
        const dist = (size / 2 / Math.tan((camera.fov * Math.PI) / 360)) * (view?.zoom ?? 1.05);
        camera.position.set(
          center.x + dist * Math.cos(el) * Math.sin(az),
          center.y + dist * Math.sin(el),
          center.z + dist * Math.cos(el) * Math.cos(az),
        );
        // straight down, "up" would be parallel to the view: use model +y (three -z)
        if ((view?.el ?? 35) > 89) camera.up.set(0, 0, -1);
        else camera.up.set(0, 1, 0);
        camera.lookAt(center);
        key.target.position.copy(center);
        key.position.copy(center).add(new THREE.Vector3(-1.2, 2.2, 1.6));
        scene.add(key.target);
        renderer.render(scene, camera);
        return true;
      };
      window.ready = true;
    </script>
  </body>
</html>
