<!--
  basilisk.fyi's mark: a rubber stamp, in two cuts — this one and `seal.svg`.
  The two are one drawing; the lettered cut is the blank one plus a final
  letters path, as on the Bible's seal.

  Drawn rather than traced, on a 1024 canvas in one ink, #b3261e: an outer ring
  at 466 (24 wide) and an inner one at 326 (10 wide); inside, an
  eye of two circular arcs meeting at ±250 with a sagitta of 150
  (24 stroke), an iris disc of 122, and a slit pupil cut out of it
  as a lens of two arcs, ±104 tall with a sagitta of 24. The lettering is
  JetBrains Mono Bold — the site's memo face — at 100 px per em, set along
  two arcs and emitted as outlines rather than <text>, since an SVG behind
  an <img> cannot reach a web font. The band runs 353.00–432.00: the top
  line's baseline on its inner edge across 164°, the bottom line's on its
  outer edge across 116°, a dot at either gap.
-->
