<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <!-- Prototypes: a blueprint, its square drawn but never filled, one red power light. -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="#1d3f8f"/>
  <rect width="600" height="600" fill="url(#grid)"/>
  <circle cx="300" cy="300" r="225" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="14 12"/>
  <rect x="150" y="150" width="300" height="300" fill="none" stroke="#faf7f0" stroke-width="8" transform="rotate(8 300 300)"/>
  <line x1="40" y1="560" x2="560" y2="40" stroke="#faf7f0" stroke-opacity="0.7" stroke-width="2"/>
  <rect x="215" y="372" width="70" height="26" fill="#faf7f0" transform="rotate(8 300 300)"/>
  <circle cx="432" cy="168" r="20" fill="#c62a1d"/>
</svg>
