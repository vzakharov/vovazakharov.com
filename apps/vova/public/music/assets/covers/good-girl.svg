<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <!-- Good Girl: a red circle shrunk to fit a frame too small for it; the stones she carried, stacked beside. -->
  <defs>
    <clipPath id="frame"><rect x="235" y="190" width="200" height="200"/></clipPath>
  </defs>
  <rect width="600" height="600" fill="#ede6dc"/>
  <circle cx="335" cy="290" r="150" fill="none" stroke="#c62a1d" stroke-width="3" stroke-dasharray="10 10"/>
  <circle cx="335" cy="290" r="150" fill="#c62a1d" clip-path="url(#frame)"/>
  <rect x="226" y="181" width="218" height="218" fill="none" stroke="#141414" stroke-width="18"/>
  <circle cx="120" cy="508" r="44" fill="#8f8a84"/>
  <circle cx="126" cy="436" r="34" fill="#a39e98"/>
  <circle cx="118" cy="380" r="25" fill="#8f8a84"/>
  <circle cx="122" cy="340" r="17" fill="#a39e98"/>
</svg>
