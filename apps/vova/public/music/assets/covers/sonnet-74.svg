  <g fill="#141414">
    <rect x="90" y="80" width="330" height="8"/><rect x="90" y="104" width="300" height="8"/><rect x="90" y="128" width="340" height="8"/><rect x="90" y="152" width="290" height="8"/>
    <rect x="90" y="184" width="320" height="8"/><rect x="90" y="208" width="350" height="8"/><rect x="90" y="232" width="300" height="8"/><rect x="90" y="256" width="330" height="8"/>
    <rect x="90" y="288" width="310" height="8"/><rect x="90" y="312" width="340" height="8"/><rect x="90" y="336" width="280" height="8"/><rect x="90" y="360" width="320" height="8"/>
    <rect x="120" y="392" width="300" height="8"/><rect x="120" y="416" width="260" height="8"/>
