  - id: beauty-operator-frame-time
    type: sticky
    updated: [2026-11-22T21:00:00.000Z, agent:board]
    box: [7260, 4170, 760, yellow]
    text: 'Operator''s M2 Pro, WebGPU, one dune place 22 m up. Facing the sea: plain 13 ms, swift 159 ms, fine 203 ms. Facing inland: plain 13, swift 68, fine 79. His verdict: he hardly sees a difference in picture between fine and swift (a few more tree blobs and grass blades in fine), while swift''s saving shows in the milliseconds, "both are a lot" (translated). So swift does what it was asked to, and fine buys little picture for its cost. Lead''s reading: both full looks are far from a frame budget, and a view with the sea costs 90–125 ms more than one without; the rest of the run goes to finding where the time goes.'
  - id: img-beauty-trees-3-canopy-swift
    type: image
    updated: [2026-11-22T21:15:00.000Z, agent:board]
    box: [8060, 4170, 300]
    src: images/beauty-trees-3-canopy-swift.webp
    text: 'Trees 3, closed canopy from 60 m, swift: every tree kept in about 40% of the triangles. Wrong in both looks (builder): faceted crowns.'
