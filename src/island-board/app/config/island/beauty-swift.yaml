    src: images/beauty-merge-8-swift-coast-560m.webp
    text: 'Swift. FAIL. Swift at 560 m after a jump from 4400 m: the previous eye positions cloud history smeared over sea and land. Fine is clean. Sent to speed as a blocker.'
