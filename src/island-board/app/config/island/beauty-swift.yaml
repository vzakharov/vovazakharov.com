  - id: beauty-operator-frame-time
    type: sticky
    updated: [2026-11-22T20:55:00.000Z, agent:board]
    box: [7260, 4170, 760, yellow]
    text: 'Operator''s M2 Pro, WebGPU, one dune place 22 m up. Facing the sea: plain 13 ms, swift 159 ms, fine 203 ms. Facing inland: plain 13, swift 68, fine 79. His verdict: "I hardly noticed a difference in quality between fine and swift" (translated from the Russian). Swift looks right and saves 15–20%, which is no middle step; a view with the sea costs 90–125 ms more. The rest of the run goes to frame time.'
