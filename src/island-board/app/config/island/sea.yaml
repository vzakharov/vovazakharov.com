items:
  - id: z-sea
    type: zone
    updated: [2026-11-15T21:45:00.000Z, agent:lead]
    box: [7900, 260, 1150, 6440, blue]
    text: 'The sea — near ground as the cube draws it outside'
  - id: sea-before
    type: image
    updated: [2026-11-15T21:15:00.000Z, agent:lead]
    box: [7940, 330, 1070]
    src: images/sea-before.webp
    text: "Where it starts: world #1's inlet beach at 30 m and at 2 m. A still turquoise wash, a flat blue sky, sand one colour"
  - id: sea-lead
    type: sticky
    updated: [2026-11-15T21:15:00.000Z, agent:lead]
    box: [7940, 700, 330, green]
    text: 'Led on Fable under /carte-blanche, branch island/sea, one PR into stretch 3: https://claude.ai/code/session_01DaohkE11JPgYbnCts79FnX. Children: island/sea-kit (the shore formulas into a shared app) and island/sea-sky (sky, sun, haze, then clouds)'
  - id: sea-slow
    type: sticky
    updated: [2026-11-15T21:15:00.000Z, agent:lead]
    box: [8300, 700, 330, yellow]
    text: 'Why the cube needs drowsy: its machinery, not its shore — an FFT wave field (4 cascades of 256², ~20 compute passes a frame), a 650k-triangle sea, a cloud ray march, a per-grain search in the sand. Swell, water level, wet sand and cusps are cheap closed forms of bed height and clock. So the island takes the formulas and drops the machinery; no rewrite of everything'
  - id: sea-wgsl
    type: sticky
    updated: [2026-11-15T21:15:00.000Z, agent:lead]
    box: [8660, 700, 330, green]
    text: "The cube's WGSL runs inside three: its shore listing goes into a three WebGPU material through TSL's wgslFn, in both vertex and fragment. One shader source for both games, not a third copy"
  - id: sea-answers
    type: sticky
    updated: [2026-11-15T21:15:00.000Z, agent:lead]
    box: [7940, 1110, 330, pink]
    text: 'Vova''s answers: clouds are in ("don''t skimp, do it with clouds"); a simple wind model to start; the target is an M2 Pro at 60 fps with no drowsy, not the phone; WebGL2 may go later'
  - id: sea-outdoors
    type: sticky
    updated: [2026-11-15T21:15:00.000Z, agent:lead]
    box: [8300, 1110, 330, orange]
    text: "Vova: the cube's island will later be part of some seeded world, so the two apps move toward one technology. Everything new is a pure WGSL function of place, clock and parameters in a shared app, outdoors, that both cube and island extend"
  - id: sea-ripples
    type: image
    updated: [2026-11-15T21:45:00.000Z, agent:lead]
    box: [7940, 1420, 1070]
    src: images/sea-ripples.webp
    text: 'Milestone 1, the sea as a surface: open ocean at 3 m and 300 m toward the sun, orbit; the inlet at 40 m and at 2 m. At 2 m the waterline is still a flat sheet: no swell, swash or wet sand yet'
  - id: sea-how
    type: sticky
    updated: [2026-11-15T21:45:00.000Z, agent:lead]
    box: [7940, 1880, 330, green]
    text: 'How: one WGSL listing called from TSL; 64 plane waves with integer wave vectors over a 256 m period, so a place taken modulo the period is exact in float32 anywhere on the planet and no tile shows a seam; the glint widens where waves are too short to see. One forward pass, no render targets'
  - id: sea-deep-bug
    type: sticky
    updated: [2026-11-15T21:45:00.000Z, agent:lead]
    box: [8300, 1880, 330, pink]
    text: "Found, older than this bite: over deep water the sea's near tiles were never drawn. The selection culled a tile by its floor (−3,500 m), not by the sea on it, so at 3 m over open ocean you saw the globe 1.5 km below; both were one flat blue. Fixed: a tile is bounded by its sea too"
  - id: sea-flash-fix
    type: sticky
    updated: [2026-11-15T21:45:00.000Z, agent:lead]
    box: [8660, 1880, 330, yellow]
    text: "Bite 3's blue flashes: the globe now draws first and writes no depth, so a stand-in pushed 3% deeper cannot fall behind it. Not yet checked on a fast flight"
  - id: sea-swash
    type: image
    updated: [2026-11-15T22:15:00.000Z, agent:lead]
    box: [7940, 2200, 1070]
    src: images/sea-swash.webp
    text: "Milestone 2, the cube's swell on the island's sea: the inlet at 2 m as a sheet runs up the sand, the same spot a second later with wet sand left behind it, and the swell on open ocean at 3 m"
  - id: sea-swash-how
    type: sticky
    updated: [2026-11-15T22:15:00.000Z, agent:lead]
    box: [7940, 2490, 330, green]
    text: "The shared app nature, extracted from the cube, is merged; the island's sea calls the cube's swell formula as it stands. One swell axis through the planet and a 64-bit clock at the eye give every fragment its phase, with nothing per tile"
  - id: sea-swash-open
    type: sticky
    updated: [2026-11-15T22:15:00.000Z, agent:lead]
    box: [8300, 2490, 330, pink]
    text: "Still open: the sheet's edge follows the 1.2 m mesh, so the shoreline is a polygon at 2 m (left frame). Next: the surf cusps' tongue softens it"
  - id: sea-sky
    type: image
    updated: [2026-11-15T22:30:00.000Z, agent:lead]
    box: [7940, 2780, 1070]
    src: images/sea-sky.webp
    text: 'Milestone 3, one air from 2 m to orbit and the sea mirroring it: the inlet at 2 m, open ocean at 3 m, the opening view from orbit. Right, a fail: from ~4,000 km space turns blue and veils the disc'
  - id: sea-sky-how
    type: sticky
    updated: [2026-11-15T22:30:00.000Z, agent:lead]
    box: [7940, 2990, 330, green]
    text: "The sky child's analytic atmosphere is merged: one model of the air at every height, and the water reflects its radiance, so the sun's glare lies on the inlet and the ocean alike. The swash now runs up in the cube's cusps, the same closed form"
  - id: sea-sky-open
    type: sticky
    updated: [2026-11-15T22:30:00.000Z, agent:lead]
    box: [8300, 2990, 330, pink]
    text: "Open: blue space from mid orbit (with the sky child); the swash's edge is still the mesh's own polygon at 2 m, which the cusps do not hide"
  - id: sea-relief
    type: image
    updated: [2026-11-15T22:40:00.000Z, agent:lead]
    box: [7940, 3250, 1070]
    src: images/sea-relief.webp
    text: 'Milestone 4, the ground off the beach: grass at 40 m with relief finer than the mesh, and the damp band of sand behind the sheet at 2 m'
  - id: sea-relief-how
    type: sticky
    updated: [2026-11-15T22:40:00.000Z, agent:lead]
    box: [7940, 3600, 330, green]
    text: "Relief below the mesh's 1.2 m cell is drawn by light alone: ridges read off the same 64-wave table as the sea's ripples, standing still, each fading as it passes under a pixel. Steep ground above the beach shows bare rock — not yet seen on a real cliff"
  - id: sea-noon
    type: image
    updated: [2026-11-15T23:00:00.000Z, agent:lead]
    box: [7940, 3860, 1070]
    src: images/sea-noon.webp
    text: 'Milestone 5: the inlet and the wet sand at noon, no longer burnt white; rock showing through snow on steep mountains at 1,500 m; orbit from 4,000 km with black space again'
  - id: sea-noon-how
    type: sticky
    updated: [2026-11-15T23:00:00.000Z, agent:lead]
    box: [7940, 4070, 330, green]
    text: "Noon burnt out because the lights were set for the opening's 20° sun; now the eye adapts, on land and sea alike. Blue space from mid orbit fixed by the sky child, checked on WebGPU. Next: clouds, the shoreline's polygons, polish, then the PR into stretch 3"
  - id: sea-clouds
    type: image
    updated: [2026-11-15T23:20:00.000Z, agent:lead]
    box: [7940, 4380, 1070]
    src: images/sea-clouds.webp
    text: 'Milestone 6, clouds: from the beach at 2 m, a cloud and its shadow on the land from 6 km, at dusk, and as cover from orbit at 4,000 km'
  - id: sea-clouds-how
    type: sticky
    updated: [2026-11-15T23:20:00.000Z, agent:lead]
    box: [7940, 4600, 330, green]
    text: "One cloud field on the sphere, seen from below, from inside and from orbit, its shadows cast through the same air every material is seen through. three's stock Perlin noise kept the page from ever loading on a software GPU; a small value noise compiles in seconds"
  - id: sea-clouds-open
    type: sticky
    updated: [2026-11-15T23:20:00.000Z, agent:lead]
    box: [8300, 4600, 330, pink]
    text: 'Open: clouds cost 2–2.8× frame time on the software rasteriser, unmeasured on a real GPU and being cut; far clouds seen edge-on band horizontally'
  - id: sea-clouds-cut
    type: image
    updated: [2026-11-15T23:40:00.000Z, agent:lead]
    box: [7940, 4870, 1070]
    src: images/sea-clouds-cut.webp
    text: 'Milestone 7, clouds at five samples a ray: from the inlet at 2 m, from 6 km and from orbit at 4,000 km'
  - id: sea-clouds-cut-how
    type: sticky
    updated: [2026-11-15T23:40:00.000Z, agent:lead]
    box: [7940, 5110, 330, green]
    text: 'Five samples a ray at a per-pixel offset instead of eight, the march stopping once under 2% light is left, the finest octave only within ~670 km. On the software renderer clouds now cost 1.4–2× the cloudless frame, down from 1.8–2.8×'
  - id: sea-clouds-cut-open
    type: sticky
    updated: [2026-11-15T23:40:00.000Z, agent:lead]
    box: [8300, 5110, 330, pink]
    text: 'Open: nothing measured on a real GPU, so 60 fps on the M2 Pro is unconfirmed; from the beach the far clouds on the horizon read as slanted strokes, few samples through a thin slab at a grazing ray'
  - id: sea-merged
    type: sticky
    updated: [2026-11-15T23:55:00.000Z, agent:lead]
    box: [8660, 5110, 330, blue]
    text: "Merged into stretch 3 as #288. The cube's sea moved out to a shared app, nature, and its shader kit to scene. Two optional /five-percent calls wait for Vova on the PR: the swell's heading from the wind, and ripples, wind and relief into nature as WGSL"
  - id: sea-moon-descent
    type: image
    updated: [2026-11-16T03:30:00.000Z, agent:lead]
    box: [7940, 5420, 1070]
    src: images/sea-moon-descent.webp
    text: "Vova's descent into a moonlit evening on the sea's build, 16 s: orbit; ~800 km, the clouds a grain of single pixels; the deck from above; inside it, all grey; the coast under the moon at ~4 km; the beach at 2 m. Video: https://github.com/vzakharov/vovazakharov.com/releases/download/island-timelapse/descent-2026-11-16-moon-night.mp4"
  - id: sea-moon-seen
    type: sticky
    updated: [2026-11-16T03:30:00.000Z, agent:lead]
    box: [7940, 5900, 330, pink]
    text: 'Seen in it: from a few hundred km the clouds break into a sparkle finer than the screen; passing through the deck the whole view is one flat grey for about a second'
  - id: sea-frame-ms
    type: image
    updated: [2026-11-16T03:30:00.000Z, agent:lead]
    box: [7940, 6200, 1070]
    src: images/sea-frame-ms.webp
    text: 'The same descent with the I panel, 19 s: at orbit, at ~820 km, at 2 m. Video: https://github.com/vzakharov/vovazakharov.com/releases/download/island-timelapse/descent-2026-11-16-moon-night-hud.mp4'
  - id: sea-fps
    type: sticky
    updated: [2026-11-16T03:30:00.000Z, agent:lead]
    box: [7940, 6380, 330, yellow]
    text: "Frame time on Vova's M2 Pro, near full screen, against 16.7 ms for 60 fps: 66–76 ms at orbit (~14 fps); 94–212 ms on the way down, worst at ~820 km; 139–146 ms at 2 m (~7 fps). Two tiles already cost 66 ms, so the price is per pixel — clouds and haze on every surface, the sea shaded under the land — read from the shaders, not profiled"
  - id: sea-fps-call
    type: sticky
    updated: [2026-11-16T03:30:00.000Z, agent:lead]
    box: [8300, 6380, 330, orange]
    text: "Vova: not fixed in this approach — the week's limits just reset and Fable is too dear before Wednesday. Asked instead whether the old look can stay, the new one behind a key: descend, press, admire, switch off. It can: the old look is intact underneath, and the toggle is ~4–5 files. Settled: the old look by default, a key turns the new one on and off. No cloudless middle: the clouds are the best of the lot — cotton-wool bits from near orbit, but beautiful from the ground"
  - id: sea-gpu
    type: sticky
    updated: [2026-11-16T03:30:00.000Z, agent:lead]
    box: [8660, 6380, 330, blue]
    text: "The WGSL kit left scene for an app of its own, gpu (62b59de6): the cube's floors, lenses and passes use it without nature, so nature stays nature"
