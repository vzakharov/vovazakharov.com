    ends: [later-2, z-scale]
    text: seen in
  - id: later-1
    type: sticky
    updated: [2026-11-15T23:55:00.000Z, agent:lead]
    box: [7800, -1340, 300, blue]
    text: "Done: merged into stretch 3 as #288, seven milestones in the sea zone. Started on Fable with /carte-blanche, on island/sea (Vova): near ground as the cube draws it outside, without the cube's need to go drowsy, maybe a rewrite. The sea bite: the general feel of web-ocean, sea and sky. A sun glint from orbit is optional, not required. Its source, agreed with Vova: the cube's own island floor already has the sea in WGSL — swell trains, the shore's water level, wet sand at the waterline, the surf's cusps (src/cube/entities/island/). Those come to the round world"
  - id: later-2
    type: sticky
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [7960, -1080, 320, yellow]
    text: "Scale: (a) stays, confirmed by Zoltan. (a) The map's README: “Arc is the size of the DR Congo”, so all land ≈ 10 M km², Europe-sized; our trace matches (5,000 km across). (b) Vova recalled Zoltan meaning the whole island Congo-sized: half the width, ~2.5 M km². A half-width render lost the snowy highlands — “fewer mountains; back to the original size”"
  - id: later-3
    type: sticky
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [8320, -1080, 260, pink]
    text: 'Vova asked Zoltan whether Congo-sized meant Arc or the whole island: “we have it right” — Arc is the Congo, the scale stays'
    done: true
  - id: coast-too-straight
    type: image
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [8170, -1610, 330]
    src: images/coast-too-straight.webp
    text: Vova's red line along the strait
  - id: later-5
    type: sticky
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [8315, -895, 280, green]
    text: "For later (Vova): the board page checks viewers' rows with zod/mini instead of full zod, and stops re-checking the data baked in at build"
  - id: later-6
    type: sticky
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [8130, -1330, 280, pink]
    text: 'Open fork — world numbers: (1) blocks with named scales; (2) one opaque number hashed whole, kin as a path 150/3/7, the island a drawn root; (3) blocks unnamed. The lead argues for (2) — settled: (2), the XOR mask, in bite 2'
    done: true
  - id: later-dice
    type: sticky
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [7880, -1910, 340, orange]
    text: "Next bite, agreed with Vova: objects from dice rolls. “Draw the island, roll a die, if lucky draw a lake, roll again” — each lake its own harmonics at its own scale, so it traces true; the strait is two lakes touching each other and the sea. Later rivers and mountains roll the same way. The die now exists: the cube lifted bite 3's roll and world hash into a shared app, @/dice, and the island moves onto it (Vova: yes) — a new roll under its own path moves no world"
  - id: later-neighbours
    type: sticky
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [8270, -1900, 310, green]
    text: "Right after bite 3 (Vova): #1 gets neighbours. Its fit keeps the drawn island and ~1,500 km of its sea, and beyond takes a random world's land, so other continents may exist there — “it must have this continent”, never “and no others”"
  - id: later-4
    type: sticky
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [7795, -1620, 300, yellow]
    text: The shore is too straight (Vova, at the strait). The noise fades out within one wavelength of the coast, so the shore is the traced line at every scale, and the strait's sea stroke is a ruler. A later bite roughens it below one pixel of the drawing, so the drawn shape holds
  - id: later-operators
    type: sticky
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [8270, -1310, 320, yellow]
    text: 'For later (Vova): operators over worlds. #1.N mutates world 1, N the strength, chaining as #1.N.M; #1x(N)#100 crosses two worlds, maybe by part — “continents from here, the sun from there”; any combination nests. Worlds built by trial, contests for the best one. And editing the hash by hand: a world is then a number plus overrides at parameter paths, which the same notation can address'
  - id: later-call8
    type: sticky
    updated: [2026-11-16T05:00:00.000Z, agent:lead]
    box: [7795, -700, 270, pink]
    text: "Call 8, deferred (Vova): random worlds keep the probe's envelope (knee 6, slope 2) for now. Earth's log-bin envelope (5.3, 2.136) stays the lead's pick and waits with C4 and the #2–#6 re-shoot; the three side by side are bite 3's last card"
  - id: later-fine-next
    type: sticky
    updated: [2026-11-16T05:00:00.000Z, agent:lead]
    box: [8085, -700, 270, orange]
    text: "Next approach (Vova): ripples, wind and ground relief move into nature as .wgsl (#288's second five-percent), then the 256 m repeat is broken there — several tables at unrelated periods mixed by place, a layer varying over kilometres — so the cube gets the fix as well"
  - id: later-fine-deferred
    type: sticky
    updated: [2026-11-16T05:00:00.000Z, agent:lead]
    box: [8375, -700, 240, yellow]
    text: "Deferred (Vova): the swell's heading from the wind, with lee shores (#288's first five-percent); the fine look's speed, 7–14 fps on the M2 Pro; the swash's polygonal edge; far clouds slanting at the horizon"
