    text: "Scale: (a) stays, confirmed by Zoltan. (a) The map's README: “Arc is the size of the DR Congo”, so all land ≈ 10 M km², Europe-sized; our trace matches (5,000 km across). (b) Vova recalled Zoltan meaning the whole island Congo-sized: half the width, ~2.5 M km². A half-width render lost the snowy highlands — “fewer mountains; back to the original size”"
