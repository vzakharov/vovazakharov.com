items:
  - id: z-beauty-merge7
    type: zone
    updated: [2026-11-22T18:10:00.000Z, agent:board]
    box: [-40, 8140, 2000, 1560, green]
    text: '12. The seventh merge: the whole beauty set in one build (cards 124 to 138)'
  - id: beauty-merge-7-row
    type: text
    updated: [2026-11-22T18:10:00.000Z, agent:board]
    box: [0, 8210, 1900, body]
    text: "The lead's fifteen frames, shot from 6974e7256: the finished coast (calm and rough stretches, skerries), the swift looks merged, the ground's second round. Verdicts are the lead's. The clouds' march is a new member's work and has not landed here yet."
  - id: img-beauty-124-merge-7-alpine-3000m
    type: image
    updated: [2026-11-22T18:10:00.000Z, agent:board]
    box: [0, 8280, 360]
    src: images/beauty-merge-7-alpine-3000m.webp
    text: '124. A range from 3 km, the after of cards 88 and 57. Lead (Vova is away): "WIN, the best frame of the run: a range with rock faces, snow on crests and in lee bowls." The frame shows grey rock faces, white crests and pale far ranges in haze.'
  - id: img-beauty-125-merge-7-alpine-300m
    type: image
    updated: [2026-11-22T18:10:00.000Z, agent:board]
    box: [385, 8280, 360]
    src: images/beauty-merge-7-alpine-300m.webp
    text: '125. The same range from 300 m, the after of card 89. Lead: "Half: snow no longer one sheet, but patches are soft round blobs like a cow''s hide that ignore the relief; rock pocks still a dot screen; contour stripes on the grass slope top right." All three are visible in the frame.'
  - id: img-beauty-126-merge-7-dunes-300m
    type: image
    updated: [2026-11-22T18:10:00.000Z, agent:board]
    box: [770, 8280, 360]
    src: images/beauty-merge-7-dunes-300m.webp
    text: '126. The dune belt from 300 m, shot moved to a calm stretch (43.733, 10.266). Lead, on cards 126 to 128: "WIN: a real dune belt, wind ripples, marram grass. Flaws: forest ends at the sand along a ruler line; a cream smear on the water at the shore (the sea''s)." Both flaws show here: the straight forest edge on the left, the cream streaks in the teal water.'
  - id: img-beauty-127-merge-7-dunes-60m
    type: image
    updated: [2026-11-22T18:10:00.000Z, agent:board]
    box: [1155, 8280, 360]
    src: images/beauty-merge-7-dunes-60m.webp
    text: '127. The same belt from 60 m, the after of card 92. Lead verdict as on card 126. Rounded cream dunes to the sea, a dark strip of forest on the left horizon, the same cream smear at the water line.'
  - id: img-beauty-128-merge-7-dunes-2m
    type: image
    updated: [2026-11-22T18:10:00.000Z, agent:board]
    box: [1540, 8280, 360]
    src: images/beauty-merge-7-dunes-2m.webp
    text: '128. A dune slope from 2 m, the after of cards 110 and 93. Lead verdict as on card 126. Fine, even wind ripples on the lower slope and sparse marram tufts higher up, under a clear sky.'
  - id: img-beauty-129-merge-7-coast-560m
    type: image
    updated: [2026-11-22T18:10:00.000Z, agent:board]
    box: [0, 8740, 360]
    src: images/beauty-merge-7-coast-560m.webp
    text: '129. The shore from 560 m, the after of card 107. Lead, on cards 129 and 130: "WIN for the coast: headlands, coves, skerries off the rough stretches, shoals. FAILURE for clouds from low down: grey level bars and a grey slab on the horizon (the cloud march; a new member is on it)." The frame shows two islets and a pale shoal off a sandy shore, and the grey bars and band across the sky.'
  - id: img-beauty-130-merge-7-coast-4400m
    type: image
    updated: [2026-11-22T18:10:00.000Z, agent:board]
    box: [385, 8740, 360]
    src: images/beauty-merge-7-coast-4400m.webp
    text: '130. The coast from 4.4 km, the after of card 106. Lead verdict as on card 129. A rocky, sandy bay with islets at the lower left, a forest plain behind, soft cloud bars over it, and a flat grey slab on the horizon.'
  - id: img-beauty-131-merge-7-coast-10600m
    type: image
    updated: [2026-11-22T18:10:00.000Z, agent:board]
    box: [770, 8740, 360]
    src: images/beauty-merge-7-coast-10600m.webp
    text: '131. From 10.6 km, the after of cards 123, 113 and 104. Lead, on cards 131 and 132: "Half: clouds are soft blobs with level stripes; straight tile edges show in the lowland''s meadow colour." The tile edges are the straight lines between paler and darker green at the left.'
  - id: img-beauty-132-merge-7-coast-34km
    type: image
    updated: [2026-11-22T18:10:00.000Z, agent:board]
    box: [1155, 8740, 360]
    src: images/beauty-merge-7-coast-34km.webp
    text: '132. From 34 km, the after of card 105. Lead verdict as on card 131. Scattered small white clouds over forest and meadow, a purple-brown patch bottom left, a little sea in the corner.'
  - id: img-beauty-133-merge-7-coast-820km
    type: image
    updated: [2026-11-22T18:10:00.000Z, agent:board]
    box: [1540, 8740, 360]
    src: images/beauty-merge-7-coast-820km.webp
    text: '133. Failure, kept. The cumulus field from 820 km, twin of cards 112, 121 and 96. Lead: "The cumulus field is square blocks (same as card 112, still there)." The frame shows the same grid of small square cloud cells over green land.'
  - id: img-beauty-134-merge-7-coast-2300km
    type: image
    updated: [2026-11-22T18:10:00.000Z, agent:board]
    box: [0, 9200, 360]
    src: images/beauty-merge-7-coast-2300km.webp
    text: '134. Europe from 2,300 km, the after of cards 122, 95 and 1. Lead: "Half: forest in patches of many sizes, no land rectangles any more; cloud edges are crochet lace." The frame shows blotchy green land, one smooth shield over France and lace at its north-eastern edge.'
  - id: img-beauty-135-merge-7-upland-300m
    type: image
    updated: [2026-11-22T18:10:00.000Z, agent:board]
    box: [385, 9200, 360]
    src: images/beauty-merge-7-upland-300m.webp
    text: '135. The upland from 300 m. Lead, on cards 135 to 137: "Half: near moor is olive-brown, far hills teal with purple hollows, two countries at one horizon." Here the near moor is olive-brown and the hills behind it teal and violet; grey streaked layers fill the sky.'
  - id: img-beauty-136-merge-7-upland-3000m
    type: image
    updated: [2026-11-22T18:10:00.000Z, agent:board]
    box: [770, 9200, 360]
    src: images/beauty-merge-7-upland-3000m.webp
    text: '136. The upland from 3 km. Lead verdict as on card 135. Bright green hollows between brown-grey hills, and a pale cloud sheet covering the right half of the frame.'
  - id: img-beauty-137-merge-7-lowland-3000m
    type: image
    updated: [2026-11-22T18:10:00.000Z, agent:board]
    box: [1155, 9200, 360]
    src: images/beauty-merge-7-lowland-3000m.webp
    text: '137. The lowland from 3 km. Lead verdict as on card 135. A teal-green plain, a violet band on the far left and three tiny pill-shaped clouds near the horizon.'
  - id: img-beauty-138-merge-7-lowland-300m
    type: image
    updated: [2026-11-22T18:10:00.000Z, agent:board]
    box: [1540, 9200, 360]
    src: images/beauty-merge-7-lowland-300m.webp
    text: '138. Failure, kept. The lowland from 300 m, twin of cards 109, 91 and 60. Lead: "From 300 m a forest reads as a lawn with scattered bushes; placed trees stop within a kilometre." The frame shows faceted round crowns scattered over a smooth green lawn.'
