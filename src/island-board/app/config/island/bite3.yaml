items:
  - id: z-bite3
    type: zone
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [4800, 260, 3014, 2810, green]
    text: 'Bite 3 — a round world, and Earth as #0'
  - id: bite3-1
    type: sticky
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [5054, 469, 320, green]
    text: 'Land becomes one formula over the whole sphere: spherical harmonics up to degree 511 (~78 km waves, as in bite 2). Tiles cover the planet as a cube of six quadtrees, so you can fly anywhere, over a pole too'
  - id: bite3-2
    type: sticky
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [5404, 484, 300, yellow]
    text: "The lead's probe: random harmonics, flat up to degree ~6 and falling as l^-2 past it, the top 29% made land. Six seeds: 6–10 continents over 1% of the land, the largest 25–63% (Earth: Afro-Eurasia ~57%). No count set anywhere — it falls out of the spectrum"
  - id: bite3-3
    type: sticky
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [5069, 789, 310, green]
    text: "#0 Earth from Natural Earth's coastlines, #1 ours re-fitted in the same place on the globe — one fit script, two inputs. Earth's measured spectrum then sets every random world's envelope: Earth tuning the dice. Each pinned world's size in bits is the generator's score"
  - id: bite3-4
    type: sticky
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [5394, 839, 300, orange]
    text: 'Parameters named by their path in a typed schema (world.land.harmonic[37][-12]), never by index: adding one never moves another world'
  - id: bite3-5
    type: sticky
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [5084, 1109, 330, orange]
    text: 'Member: https://claude.ai/code/session_01DaohkBX5UEgj2eV8Vg3Kf1 on island/round-world; contract docs/plans/world-game-zoltan-syama/bite-3.md'
  - id: bite3-seam
    type: image
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [5044, 1449, 480]
    src: images/bite3-seam.webp
    text: 'Vova: a seam where a fine tile meets a coarser one — the skirt hides the hole, not the step'
  - id: bite3-calls-14-15
    type: sticky
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [5584, 1489, 300, yellow]
    text: 'Taken into bite 3: tiles of two levels match along their edge (call 14), and a button in the I panel copies a link, #world@lat,lon,height,heading,pitch, that opens that exact view, so the lead can reproduce what Vova sees (call 15)'
  - id: bite3-first-sphere
    type: image
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [6754, 1529, 320]
    src: images/bite3-first-sphere.webp
    text: 'First flight over the sphere: #1 alone on the globe, lit from the NW, and the same island from 1,000 km. The world builds in 1.4 s. The thin spits are real land from the fit'
  - id: bite3-noon-midnight
    type: image
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [6754, 1689, 320]
    src: images/bite3-noon-midnight.webp
    text: "#1 from 1,000 km at noon and at midnight, the same spot: the sun 80° up, then 80° down. Midnight is the full moon's, about 7× darker, and snow turns blue-grey"
  - id: bite3-b2-field
    type: image
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [6094, 1489, 640]
    src: images/bite3-b2-field.webp
    text: "World #2 on the sphere, flattened: the coast and lines every 500 km out to sea. They close across the map's seam and ring the small islands evenly — distance is true on the globe. Built in 1.04 s"
  - id: bite3-probe
    type: image
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [5754, 449, 290]
    src: images/bite3-probe-worlds.webp
    text: 'Six random round worlds from the probe, flattened onto a map'
  - id: bite3-worlds-a
    type: image
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [6404, 429, 300]
    src: images/bite3-worlds-a.webp
    text: "The game's first round worlds, #2–#7 at degree 511: land 26–33%, 6–15 landmasses over 1% of the land, the largest 27–78%. Built in 175 ms"
  - id: bite3-globes-probe
    type: image
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [6074, 479, 290]
    src: images/bite3-globes-probe.webp
    text: 'The same six as globes, each from three sides 120° apart (Vova: on globes, side by side)'
  - id: bite3-globes-a
    type: image
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [6739, 459, 300]
    src: images/bite3-globes-a.webp
    text: '#2–#7 as globes, three sides each'
  - id: bite3-sun
    type: sticky
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [5424, 1119, 300, yellow]
    text: "Sun: Vova chose the full-moon mode — the sun fixed in space, a full moon always opposite it, so night is moonlit, not black; [ and ] turn the day, T pauses it. A world opens under today's low NW sun, time paused"
  - id: bite3-seams
    type: image
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [6094, 1929, 640]
    src: images/bite3-seams.webp
    text: "Seams: crossing a cube-face edge over #2's hills at 10 km, and over the sea at 1,000 km — nothing on the edge. Right: 10 km straight down over #1, soft by design (tiles stop at level 11 there, ~76 m apart). Next, call 14: a finer tile takes its coarser neighbour's border"
  - id: bite3-cut2
    type: sticky
    updated: [2026-11-15T21:00:00.000Z, agent:lead]
    box: [5764, 839, 290, pink]
    text: 'Cut 2 takes bite 3 as it stands (Vova: "for now we take it as is, decide later") — merged to main as 4d5ef08b, live at /island. Left open, not dropped: call 8 (the random worlds'' envelope), C4 on it, the re-shoot of #2–#6 and the Earth-vs-20-worlds table, the Gulf islet, the moiré'
    done: true
  - id: bite3-flicker-left
    type: sticky
    updated: [2026-11-15T21:00:00.000Z, agent:lead]
    box: [5764, 1159, 290, pink]
    text: 'Still flickering on the cut-2 preview, only over ground not yet seen (Vova). Found, not fixed: a stand-in tile is pushed 3% deeper so finer tiles win, and above ~50 km that puts it behind the ocean globe 1.5 km under the sea, so the gap shows blue for 1–3 frames. Seen ground is cached, nothing stands in. Fix: keep the globe behind every tile (~1 h), or a stencil instead of the push (~a day)'
  - id: bite3-flicker
    type: image
    updated: [2026-11-15T21:00:00.000Z, agent:lead]
    box: [5044, 1960, 620]
    src: images/bite3-flicker.webp
    text: "Vova's flicker, frame by frame: top, a three-quadrant hole for one frame; bottom, an L that shrinks to one square as the missing tiles land, then closes"
  - id: bite3-coast-finer
    type: image
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [7154, 2249, 620]
    src: images/bite3-coast-finer.webp
    text: 'How much finer the coast is cut, on #0 over Italy (columns: as now, one step coarser, two). Top two rows 13 km: coarser saws the waterline and turns the S-islet into two ovals, then into nothing. Bottom rows 527 m: the dunes go soft, then smooth. Coarser would cut the wait by 15–40%; more workers halve it at no cost to the look, so the coast stays and the workers grow. Measured in a browser: 4 cost ~+200 MB, 3 cost ~+100 MB and already settle a phone 4.35 → 3.4 s at 527 m, so 3 it is, capped by device memory'
  - id: bite3-holes-fixed
    type: image
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [7154, 1929, 620]
    src: images/bite3-holes-fixed.webp
    text: 'Both fixed, on #0 over Calabria: left, the same fast turn before; middle, after — no blue below the horizon in any frame; right, the fast descent at 923 m, fine ground all the way down. A coarser ancestor of each tile is held and fetched first (6–9% more fills), and drawn just behind the finer tiles until they arrive'
  - id: bite3-holes
    type: image
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [7154, 1589, 620]
    src: images/bite3-holes.webp
    text: "Vova's holes on turns, found: left, his frame at 529 m over Calabria; middle, a fast 8-step turn on the same spot; right, the same view 400 ms after the turn stops. The blue is the ocean globe under the land, showing where tiles for the side turned into are not yet in hand and nothing stands in for them. Fix in progress: the finest tile already in hand stands in. The same cover held #0 on level-2 tiles through the whole descent; that half is fixed"
  - id: bite3-floor
    type: image
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [7154, 1249, 620]
    src: images/bite3-floor.webp
    text: "Vova's sand band at 121 m, before and after: ground that dipped under the lowland floor was clamped flat; now it is squeezed up, keeping its order, so it still rolls and shades. Level ground near the coast 34% → 4%; fill time unchanged"
  - id: bite3-earth
    type: image
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [7154, 909, 620]
    src: images/bite3-earth.webp
    text: '#0, Earth, in the game: Africa and the Americas from orbit, Italy from 1,000 km. Fitted from Natural Earth; builds in 1.4 s. Its colours still come from generated height, so the poles are not iced and some low land (Sahara, Amazonia) shows snow — a later bite colours land by climate'
  - id: bite3-envelopes
    type: image
    updated: [2026-11-15T20:00:00.000Z, agent:lead]
    box: [7154, 260, 620]
    src: images/bite3-envelopes.webp
    text: 'Call 8, for Vova: worlds #2–#6 (rows; two sides each) under three envelopes. Left: the probe, 8.7 landmasses, the largest 44%. Middle: Earth measured (log bins), 7.3, the largest 51%, a Pangaea in one world of five; the member and the lead take it (Earth: 5, 54%). Right: Earth per degree, 11.4, 34%, more channels'
