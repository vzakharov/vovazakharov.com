items:
  - id: z-beauty
    type: zone
    updated: [2026-11-22T11:00:00.000Z, agent:board]
    box: [11760, 380, 2000, 2400, green]
    icon: 🎞️
    text: 'Making it beautiful: the timelapse, failures included'
  - id: beauty-howto
    type: text
    updated: [2026-11-22T11:00:00.000Z, agent:board]
    box: [11800, 450, 1900, body]
    text: 'Every frame the builders shoot lands here the turn it exists, numbered in the order it arrives. Rows are packages: relief, the ground, clouds, trees, speed. A failure is captioned as one. Top row: the world as the run found it, fine look.'
  - id: img-beauty-01-before-coast-2300km
    type: image
    updated: [2026-11-22T10:35:00.000Z, agent:board]
    box: [11800, 580, 360]
    src: images/beauty-before-coast-2300km.webp
    text: '1. Before. From orbit (2,300 km) the clouds are salt-and-pepper speckle with no systems or edges; the land is smooth blobs of green and brown.'
  - id: img-beauty-02-before-coast-10600m
    type: image
    updated: [2026-11-22T10:35:00.000Z, agent:board]
    box: [12185, 580, 360]
    src: images/beauty-before-coast-10600m.webp
    text: '2. Before. From 10.6 km sand lies in flat sheets kilometres inland; clouds are featureless cotton with a dither hatch on every edge.'
  - id: img-beauty-03-before-coast-560m
    type: image
    updated: [2026-11-22T10:35:00.000Z, agent:board]
    box: [12570, 580, 360]
    src: images/beauty-before-coast-560m.webp
    text: '3. Before. From 560 m: low smooth domes of one character; a band is one flat colour, no surface.'
  - id: img-beauty-04-before-sky-2m
    type: image
    updated: [2026-11-22T10:35:00.000Z, agent:board]
    box: [12955, 580, 360]
    src: images/beauty-before-sky-2m.webp
    text: '4. Before. From 2 m the sky is a grey smear along the horizon, over a flat dark sea.'
  - id: img-beauty-05-before-ocean-2300km
    type: image
    updated: [2026-11-22T10:35:00.000Z, agent:board]
    box: [13340, 580, 360]
    src: images/beauty-before-ocean-2300km.webp
    text: '5. Before. The open ocean from orbit (2,300 km).'
  - id: beauty-06-webgpu-lost
    type: sticky
    updated: [2026-11-22T10:35:00.000Z, agent:board]
    box: [13280, 1010, 420, pink]
    text: '6. Failure. The still shooter could not draw on WebGPU here: the software device is lost at the first tile upload. Frames are shot on WebGL2, where the fine look draws everything but the rippled sea.'
  - id: img-beauty-07-relief-1-coast-2300km
    type: image
    updated: [2026-11-22T10:55:00.000Z, agent:board]
    box: [11800, 1010, 360]
    src: images/beauty-relief-1-coast-2300km.webp
    text: "7. Relief, step 1. Mountains are gathered into belts and read as ranges from orbit. Flaw: the snow shows a leopard pattern of rounded cells, the noise's own shape."
  - id: img-beauty-08-relief-1-coast-10600m
    type: image
    updated: [2026-11-22T10:55:00.000Z, agent:board]
    box: [12185, 1010, 360]
    src: images/beauty-relief-1-coast-10600m.webp
    text: '8. Relief, step 1. Sand is the beach and its dunes only; the plain behind is green. Flaw: the lowland is dead flat, the low domes of before are gone.'
  - id: img-beauty-09-relief-1-coast-560m
    type: image
    updated: [2026-11-22T10:55:00.000Z, agent:board]
    box: [12570, 1010, 360]
    src: images/beauty-relief-1-coast-560m.webp
    text: '9. Relief, step 1. A beach, a dune belt, then lowland. Flaw: the dunes read as straight stripes parallel to the shore, and no hill is in sight.'
  - id: beauty-07-verdict
    type: sticky
    updated: [2026-11-22T10:55:00.000Z, agent:board]
    box: [12955, 1010, 300, yellow]
    text: 'Lead, on cards 7 to 9 (Vova is away): "Half a win: ranges and the shore are right, the lowland went flat. Sent back."'
