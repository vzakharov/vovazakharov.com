items:
  - id: z-beauty
    type: zone
    updated: [2026-11-22T19:00:00.000Z, agent:board]
    box: [-40, 3700, 2900, 2190, green]
    icon: 🎨
    text: 'Making it beautiful, failures included. 1. From above'
  - id: beauty-howto
    type: text
    updated: [2026-11-22T19:00:00.000Z, agent:board]
    box: [0, 3770, 2240, body]
    text: "Each row is one view; its frames run left to right in the order they were shot. A caption gives the stage, then the verdict with whose it is (the lead's while Vova is away, or the builder's own). A failure is captioned as one. Every frame, all 205 at full size, is kept at https://github.com/vzakharov/vovazakharov.com/tree/0682dbea0879a4dfd9f4d56b039a0742abff6c49/docs/remove-before-merging/island-beauty-c1rj3b/frames"
  - id: beauty-row-a
    type: text
    updated: [2026-11-22T19:00:00.000Z, agent:board]
    box: [0, 3840, 240, body]
    text: 'Europe from 2,300 km'
  - id: img-beauty-01-before-coast-2300km
    type: image
    updated: [2026-11-22T19:00:00.000Z, agent:board]
    box: [260, 3830, 300]
    src: images/beauty-before-coast-2300km.webp
    text: 'Before: cloud speckle with no systems; the land is smooth blobs.'
  - id: img-beauty-22-ground-1-coast-2300km
    type: image
    updated: [2026-11-22T19:00:00.000Z, agent:board]
    box: [580, 3830, 300]
    src: images/beauty-ground-1-coast-2300km.webp
    text: 'Ground 1: the upland varies; the builder: the forest is a checkerboard with tile seams.'
  - id: img-beauty-63-ground-2-coast-2300km
    type: image
    updated: [2026-11-22T19:00:00.000Z, agent:board]
    box: [900, 3830, 300]
    src: images/beauty-ground-2-merged-coast-2300km.webp
    text: 'Merge 2. Failure (lead): forest in rectangles along tile edges; the range lost its snow.'
  - id: img-beauty-95-clouds-1-coast-2300km
    type: image
    updated: [2026-11-22T19:00:00.000Z, agent:board]
    box: [1220, 3830, 300]
    src: images/beauty-clouds-1-coast-2300km.webp
    text: 'Clouds 1: open cells and a front; the builder: the cells still read as lace.'
  - id: img-beauty-134-merge-7-coast-2300km
    type: image
    updated: [2026-11-22T19:00:00.000Z, agent:board]
    box: [1540, 3830, 300]
    src: images/beauty-merge-7-coast-2300km.webp
    text: 'Merge 7. Half (lead): forest patches of many sizes; cloud edges are crochet lace.'
  - id: beauty-row-b
    type: text
    updated: [2026-11-22T19:00:00.000Z, agent:board]
    box: [0, 4170, 240, body]
    text: 'The cumulus field from 820 km'
  - id: img-beauty-23-ground-1-coast-820km
    type: image
    updated: [2026-11-22T19:00:00.000Z, agent:board]
    box: [260, 4160, 300]
    src: images/beauty-ground-1-coast-820km.webp
    text: 'Ground 1: almost all cloud speckle; the ground barely shows.'
  - id: img-beauty-86-merge-4-coast-820km
    type: image
    updated: [2026-11-22T19:00:00.000Z, agent:board]
    box: [580, 4160, 300]
    src: images/beauty-merge-4-coast-820km.webp
    text: 'Merge 4. Failure (lead): the operator''s "many, many bits of cotton wool" (translated).'
