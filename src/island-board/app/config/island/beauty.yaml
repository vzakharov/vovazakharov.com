items:
  - id: z-beauty
    type: zone
    updated: [2026-11-22T11:00:00.000Z, agent:board]
    box: [11760, 380, 2000, 3600, green]
    icon: 🎞️
    text: 'Making it beautiful: the timelapse, failures included'
  - id: beauty-howto
    type: text
    updated: [2026-11-22T11:00:00.000Z, agent:board]
    box: [11800, 450, 1900, body]
    text: 'Every frame the builders shoot lands here the turn it exists, numbered in the order it arrives. Rows are packages: relief, the ground, clouds, trees, speed. A failure is captioned as one. Top row: the world as the run found it, fine look.'
  - id: img-beauty-01-before-coast-2300km
    type: image
    updated: [2026-11-22T10:35:00.000Z, agent:board]
    box: [11800, 580, 360]
    src: images/beauty-before-coast-2300km.webp
    text: '1. Before. From orbit (2,300 km) the clouds are salt-and-pepper speckle with no systems or edges; the land is smooth blobs of green and brown.'
  - id: img-beauty-02-before-coast-10600m
    type: image
    updated: [2026-11-22T10:35:00.000Z, agent:board]
    box: [12185, 580, 360]
    src: images/beauty-before-coast-10600m.webp
    text: '2. Before. From 10.6 km sand lies in flat sheets kilometres inland; clouds are featureless cotton with a dither hatch on every edge.'
  - id: img-beauty-03-before-coast-560m
    type: image
    updated: [2026-11-22T10:35:00.000Z, agent:board]
    box: [12570, 580, 360]
    src: images/beauty-before-coast-560m.webp
    text: '3. Before. From 560 m: low smooth domes of one character; a band is one flat colour, no surface.'
  - id: img-beauty-04-before-sky-2m
    type: image
    updated: [2026-11-22T10:35:00.000Z, agent:board]
    box: [12955, 580, 360]
    src: images/beauty-before-sky-2m.webp
    text: '4. Before. From 2 m the sky is a grey smear along the horizon, over a flat dark sea.'
  - id: img-beauty-05-before-ocean-2300km
    type: image
    updated: [2026-11-22T10:35:00.000Z, agent:board]
    box: [13340, 580, 360]
    src: images/beauty-before-ocean-2300km.webp
    text: '5. Before. The open ocean from orbit (2,300 km).'
  - id: beauty-06-webgpu-lost
    type: sticky
    updated: [2026-11-22T10:35:00.000Z, agent:board]
    box: [13280, 1010, 420, pink]
    text: '6. Failure. The still shooter could not draw on WebGPU here: the software device is lost at the first tile upload. Frames are shot on WebGL2, where the fine look draws everything but the rippled sea.'
  - id: img-beauty-07-relief-1-coast-2300km
    type: image
    updated: [2026-11-22T10:55:00.000Z, agent:board]
    box: [11800, 1010, 360]
    src: images/beauty-relief-1-coast-2300km.webp
    text: "7. Relief, step 1. Mountains are gathered into belts and read as ranges from orbit. Flaw: the snow shows a leopard pattern of rounded cells, the noise's own shape."
  - id: img-beauty-08-relief-1-coast-10600m
    type: image
    updated: [2026-11-22T10:55:00.000Z, agent:board]
    box: [12185, 1010, 360]
    src: images/beauty-relief-1-coast-10600m.webp
    text: '8. Relief, step 1. Sand is the beach and its dunes only; the plain behind is green. Flaw: the lowland is dead flat, the low domes of before are gone.'
  - id: img-beauty-09-relief-1-coast-560m
    type: image
    updated: [2026-11-22T10:55:00.000Z, agent:board]
    box: [12570, 1010, 360]
    src: images/beauty-relief-1-coast-560m.webp
    text: '9. Relief, step 1. A beach, a dune belt, then lowland. Flaw: the dunes read as straight stripes parallel to the shore, and no hill is in sight.'
  - id: beauty-07-verdict
    type: sticky
    updated: [2026-11-22T10:55:00.000Z, agent:board]
    box: [12955, 1010, 300, yellow]
    text: 'Lead, on cards 7 to 9 (Vova is away): "Half a win: ranges and the shore are right, the lowland went flat. Sent back."'
  - id: img-beauty-10-relief-2-coast-2300km
    type: image
    updated: [2026-11-22T11:20:00.000Z, agent:board]
    box: [11800, 1470, 360]
    src: images/beauty-relief-2-coast-2300km.webp
    text: '10. Relief, step 2. The snow is a spine along the range; the leopard pattern is gone.'
  - id: img-beauty-11-relief-2-lowland-300m
    type: image
    updated: [2026-11-22T11:20:00.000Z, agent:board]
    box: [12185, 1470, 360]
    src: images/beauty-relief-2-lowland-300m.webp
    text: '11. Relief, step 2. From 300 m the lowland rolls: hills to the horizon. Flaw: all of one size, and mauve patches where the old shader paints rock on gentle flanks.'
  - id: img-beauty-12-relief-2-upland-300m
    type: image
    updated: [2026-11-22T11:20:00.000Z, agent:board]
    box: [12570, 1470, 360]
    src: images/beauty-relief-2-upland-300m.webp
    text: '12. Relief, step 2. From 300 m, subalpine upland: a hummocky plateau with outcrops, green valleys beyond.'
  - id: img-beauty-13-relief-2-alpine-3000m
    type: image
    updated: [2026-11-22T11:20:00.000Z, agent:board]
    box: [12955, 1470, 360]
    src: images/beauty-relief-2-alpine-3000m.webp
    text: "13. Relief, step 2. From 3 km, an alpine range: ridges, spurs, valley floors. Flaw: snow lies in blotches by height alone, the ground shader's job next."
  - id: img-beauty-14-relief-2-dunes-300m
    type: image
    updated: [2026-11-22T11:20:00.000Z, agent:board]
    box: [13340, 1470, 360]
    src: images/beauty-relief-2-dunes-300m.webp
    text: '14. Relief, step 2. Failure: from 300 m the dune belt is a thin strip with a few dashes; no dune reads as a dune. Sent back.'
  - id: img-beauty-15-relief-2-coast-560m
    type: image
    updated: [2026-11-22T11:20:00.000Z, agent:board]
    box: [11800, 1930, 360]
    src: images/beauty-relief-2-coast-560m.webp
    text: '15. Relief, step 2. Failure: from 560 m, the same strip, the dune belt flattened to a thin band with a few dashes. Sent back.'
  - id: img-beauty-16-relief-2-w3-orbit
    type: image
    updated: [2026-11-22T11:30:00.000Z, agent:board]
    box: [12570, 1930, 360]
    src: images/beauty-relief-2-w3-orbit.webp
    text: "16. Relief, step 2, the relief session's own frame: generated world 3 from 20,000 km. Mountain ranges run as brown belts along and across the continents; the white blotches over the sea and land are clouds. Wrong, by the builder: nothing to see at this distance, the lowland is one flat green."
  - id: img-beauty-17-relief-2-w3-alpine-10km
    type: image
    updated: [2026-11-22T11:30:00.000Z, agent:board]
    box: [12955, 1930, 360]
    src: images/beauty-relief-2-w3-alpine-10km.webp
    text: "17. Relief, step 2, the relief session's own frame: an alpine range from 10 km on world 3, ridges and cirques under cloud. Wrong, by the builder: shot before the later dune and lowland changes, so it stands for the mountains only."
  - id: beauty-15-verdict
    type: sticky
    updated: [2026-11-22T11:20:00.000Z, agent:board]
    box: [12185, 1930, 320, yellow]
    text: 'Lead, on cards 10 to 15 (Vova is away): "A real win for the mountains and the hills. Dunes sent back; the surface is now the weakest part."'
