items:
  - id: z-graffiti
    type: zone
    updated: [2026-11-11T05:32:00.000Z, agent:cube]
    box: [0, 1820, 3540, 900, pink]
    text: Graffiti economy
  - id: graf-idea
    type: sticky
    updated: [2026-11-11T05:32:00.000Z, agent:cube]
    box: [28, 1930, 244, pink]
    text: "Vova's idea: pay to paint any wall, checked by a neural net. Paint changes the game: a spider becomes a monster, a jackhammer a findable artifact. What a painting becomes is never promised; we look and decide"
  - id: graf-time
    type: sticky
    updated: [2026-11-11T06:02:00.000Z, agent:cube]
    box: [363, 1930, 244, pink]
    text: 'Time to cross floor n: ~5 s a room × 4^(n−1). Floor 6 ≈ 1.5 h (casual), 7 ≈ an evening, 8 ≈ a day, 10 ≈ 360 h'
  - id: graf-price-a
    type: sticky
    updated: [2026-11-11T05:32:00.000Z, agent:cube]
    box: [698, 1930, 244, pink]
    text: 'Price A: ×¼ a floor down. Every floor has the same wall area, so this is one price per square metre'
  - id: graf-price-b
    type: sticky
    updated: [2026-11-11T06:02:00.000Z, agent:cube]
    box: [1033, 1930, 244, pink]
    text: 'Price, the pick: a blank wall costs what it costs us (the payment fee and the net''s check), on every floor. Paint over a painting by paying double its price; its painter gets the whole price back as credit for another wall, never cash, and it stays forever as a layer beneath'
  - id: graf-price-c
    type: sticky
    updated: [2026-11-11T06:02:00.000Z, agent:cube]
    box: [1368, 1930, 244, pink]
    text: 'Why: doubling catches a wall up with the market, so a floor-1 wall sold for $10 in month one is not sold forever. No constant per floor, no auction; no payouts, so no marketplace and nothing to speculate on. Deep down no one paints over, so a painting there is forever in practice'
  - id: graf-rule
    type: sticky
    updated: [2026-11-11T05:32:00.000Z, agent:cube]
    box: [28, 2180, 244, pink]
    text: 'The rule: a painting changes the constant, never the exponent. The jackhammer breaks walls, never floors, so the lock still holds'
  - id: graf-depth
    type: sticky
    updated: [2026-11-11T05:32:00.000Z, agent:cube]
    box: [363, 2180, 244, pink]
    text: "Proof of depth: to paint floor n, show its hole's answer. Only who got there paints there"
  - id: graf-instant
    type: sticky
    updated: [2026-11-11T05:32:00.000Z, agent:cube]
    box: [698, 2180, 244, pink]
    text: 'Shown at once, after moderation: Stripe → a Worker → the net → R2, and the game reads R2. Not a git branch: raw GitHub caches ~5 min, and the push needs a server anyway'
  - id: graf-open
    type: sticky
    updated: [2026-11-11T05:32:00.000Z, agent:cube]
    box: [1033, 2180, 244, gray]
    text: 'Open: one shared world, so a found answer leaks; the terms must call a mechanic a gift, not a promise. Not a blockchain: nothing on a chain can be taken down'
