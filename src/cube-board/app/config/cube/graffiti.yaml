items:
  - id: z-graffiti
    type: zone
    updated: [2026-11-11T05:32:00.000Z, agent:cube]
    box: [0, 1820, 3540, 900, pink]
    text: Graffiti economy
  - id: graf-idea
    type: sticky
    updated: [2026-11-11T05:32:00.000Z, agent:cube]
    box: [28, 1930, 244, pink]
    text: "Vova's idea: pay to paint any wall, checked by a neural net. Paint changes the game: a spider becomes a monster, a jackhammer a findable artifact. What a painting becomes is never promised; we look and decide"
  - id: graf-time
    type: sticky
    updated: [2026-11-11T06:08:00.000Z, agent:cube]
    box: [363, 1930, 244, pink]
    text: 'Time to cross floor n: ~5 s a room × 4^(n−1). Floor 6 ≈ 1.5 h (casual), 7 ≈ an evening, 8 ≈ a day, 10 ≈ 360 h. Reaching floor 7 takes ~2 h, the six above it summed'
  - id: graf-price-a
    type: sticky
    updated: [2026-11-11T06:13:00.000Z, agent:cube]
    box: [698, 1930, 244, pink]
    text: '1. A blank wall''s start price: $10k at the start room of floor 1, and from there it falls the way the crowd thins, about ×⅓ a floor. Never below what it costs us (the payment fee and the net''s check). Floor 5 ≈ $120, floor 7 ≈ $14'
  - id: graf-price-b
    type: sticky
    updated: [2026-11-11T06:13:00.000Z, agent:cube]
    box: [1033, 1930, 244, pink]
    text: '2. In theory, not to build: the price follows the path, not the floor number. The room above a hole and the room below it are seen by the same people, so they cost the same; the ×⅓ is spent walking from the landing to the next hole, and a dead end off the path is cheaper still'
  - id: graf-price-c
    type: sticky
    updated: [2026-11-11T06:15:00.000Z, agent:cube]
    box: [1368, 1930, 244, pink]
    text: '3. Open: what a paid wall is. Forever at a high fixed price, as on the Million Dollar Homepage, or honest rent for a term at the price of its day. Not painted over: someone who paid $1000 is not told to find another wall'
  - id: graf-ruled-out
    type: sticky
    updated: [2026-11-11T06:25:00.000Z, agent:cube]
    box: [1368, 2180, 244, gray]
    text: 'Ruled out: a constant per floor or a cut-off at floor 3 (arbitrary); a one-off auction (sold for $10 in month one, hands tied); overpaint at ×2 (takes a paid wall away); payouts, transferable credit, gifts (a market in money); measuring who passes a wall; a Worker checking holes at walking pace (the cube stays static)'
  - id: graf-rule
    type: sticky
    updated: [2026-11-11T05:32:00.000Z, agent:cube]
    box: [28, 2180, 244, pink]
    text: 'The rule: a painting changes the constant, never the exponent. The jackhammer breaks walls, never floors, so the lock still holds'
  - id: graf-depth
    type: sticky
    updated: [2026-11-11T06:25:00.000Z, agent:cube]
    box: [363, 2180, 244, pink]
    text: "Proof of depth: to paint floor n, show its hole's answer. Only who got there paints there, by legs or by silicon. Idea: Argon2 over SHA-256 for the seals takes a GPU's head start away, the exponent untouched; the difficulty calculator would follow"
  - id: graf-silicon
    type: sticky
    updated: [2026-11-11T06:25:00.000Z, agent:cube]
    box: [1703, 2180, 244, pink]
    text: 'Idea, brute force as a feature: legs go down to ~floor 10, below that only silicon. Floor n takes ~4^n hashes, so floor 30 is a hundred GPUs for a fortnight and floor 40, the same hundred for ~40,000 years. Each hole is a public bounty; a crack is news ("floor 27 fell"), and the deepest floor found reads as the world''s hashing power. A tab left open can dig too, the crowd as one farm, and the finder paints'
  - id: graf-instant
    type: sticky
    updated: [2026-11-11T05:32:00.000Z, agent:cube]
    box: [698, 2180, 244, pink]
    text: 'Shown at once, after moderation: Stripe → a Worker → the net → R2, and the game reads R2. Not a git branch: raw GitHub caches ~5 min, and the push needs a server anyway'
  - id: graf-open
    type: sticky
    updated: [2026-11-11T06:17:00.000Z, agent:cube]
    box: [1033, 2180, 244, gray]
    text: 'Open: one shared world, so a found answer leaks, and that is fine: knowing the answer is what reaching a floor means. What a painting becomes in the game is a gift, not a promise. Not a blockchain: nothing on a chain can be taken down. Painting for hire happens off-site whatever we rule; we issue nothing a player can hand on'
