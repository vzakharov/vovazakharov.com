  - id: one-7
    type: sticky
    updated: [2026-11-12T21:40:00.000Z, agent:cube]
    box: [5008, 110, 244, yellow]
    icon: 🕳️
    text: "Idea, for the next replanting: plant every hole in a dead end, so the street from the landing ends in a cul-de-sac and a blind search has to turn off for it. Dead ends are ~28% of a floor's rooms, so the lock loses ~1.8 bits a floor of its 2(n−1). Costs every stored URL, and floor 3's joke, which Vova likes: kept as it is for now"
  - id: one-1
    type: sticky
    updated: [2026-11-11T16:10:00.000Z, agent:cube]
    box: [3668, 110, 244, blue]
    icon: ✅
    text: "Built: floor 2's hole two steps from its landing, so exactly one room there is for sale; the lever swings down when pulled; the floor in a corner; the URL keeps the last hatch and, lightly hidden, where you stand. A room for sale shows «For sale, $9,999,999» on its far wall, or on a post where no wall is left; E opens a stub offer, and a bought room reads «Sold / Yours», its floor a shade lighter"
  - id: one-2
    type: sticky
    updated: [2026-11-11T13:40:00.000Z, agent:cube]
    box: [4003, 110, 244, yellow]
    icon: 🏜️
    text: "Idea, for later: a mirage, the lever seen through a wall, wanted and out of reach, with no known way round. Fair, since it shows the hole room from its four neighbours too, a constant ×5, not a shortcut. Seen once by accident on floor 3: the plate's back lies in a wall with no thickness, a depth tie that walls with thickness end"
  - id: one-3
    type: sticky
    updated: [2026-11-11T14:20:00.000Z, agent:cube]
    box: [4338, 110, 244, yellow]
    icon: 🏚️
    text: 'Our floor 3 is a joke: you land in room (3,1) and the hole is in (3,2), right behind the south wall, three steps round by the maze. Four rooms are the whole walk; the other 12 of 16 stand idle, every one for sale'
  - id: one-4
    type: sticky
    updated: [2026-11-11T15:40:00.000Z, agent:cube]
    box: [3668, 450, 244, blue]
    icon: ➕
    text: 'Buy more: once a room is bought, its neighbour through the one opening is a dead end in turn if every other side is a wall or a bought room, and its sign reads «buy more» to the owner. A neighbour with another opening stays unsold, no sign. Tried now with purchases kept only while the page is open, a bought room marked a little apart'
  - id: one-5
    type: sticky
    updated: [2026-11-11T17:00:00.000Z, agent:cube]
    box: [4673, 110, 244, blue]
    icon: 🏷️
    text: 'Prices tagged like a shop: from $1 up, the nearest price ending in nines, above or below. Whole dollars end in 99 while that stays $100 or more, cents in 9.99 from $10 and in .99 under it. $10M reads $9,999,999, $19,531 reads $19,499, $38.15 reads $39.99, $4.77 reads $4.99'
  - id: one-6
    type: sticky
    updated: [2026-11-11T18:30:00.000Z, agent:cube]
    box: [4673, 450, 244, yellow]
    icon: 💳
    text: 'Paying, open, and nobody knows how yet: Stripe takes $0.50 to $999,999.99 a charge, so floors 2 and 3 would go for bitcoin, an address and a sum on a static page. Below them, one payment link per floor, quantity left to the buyer, no server. No room sells under $4.99: a room on floor 9 or any deeper costs that, however small. Vova likes the whole sale idea less the further it goes; kept as it stands for now'
  - id: one-8
    type: sticky
    updated: [2026-11-14T10:10:00.000Z, agent:cube]
    box: [5008, 450, 244, yellow]
    icon: ✋
    text: 'Idea, a bug kept as a feature: doors that open into the room behind the wall. A hand on the right wall walks a whole tree floor, but a door cuts the wall, and a cut-off run can become an island the hand circles forever. At 5 doors per 100 rooms on a 32×32 floor, the hand that takes doors misses the hole 87% of the time; skip them and the rule still holds, so it fools only whoever was tempted'
