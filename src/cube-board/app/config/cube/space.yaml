  - id: graf-idea
    type: sticky
    updated: [2026-11-11T12:20:14.000Z, agent:cube]
    box: [28, 1930, 244, pink]
    icon: 💡
    text: "Vova's idea: pay to paint any wall, checked by a neural net. Paint changes the game: a spider becomes a monster, a jackhammer a findable artifact. What a painting becomes is never promised; we look and decide"
  - id: space-models
    type: sticky
    updated: [2026-11-11T12:20:14.000Z, agent:cube]
    box: [363, 1930, 244, pink]
    icon: 🗿
    text: "Vova's idea: not only paint. Buy a box for a 3D model of your own, made in Blender or whatever, uploaded to the game, and pay for the box's volume. Coca-Cola puts up a monument to the bottle instead of a graffiti"
  - id: space-room
    type: sticky
    updated: [2026-11-11T12:20:14.000Z, agent:cube]
    box: [698, 1930, 244, pink]
    icon: 🔑
    text: 'Or buy the whole room and furnish it as you like, models and walls, with a guarantee no one else moves in. Same $/m³, no premium for exclusivity. Sold whole only while empty; boxes in one room never overlap'
  - id: space-audience
    type: sticky
    updated: [2026-11-11T12:20:14.000Z, agent:cube]
    box: [1033, 1930, 244, pink]
    icon: 👀
    text: "Why ×8 is fair: the player shrinks with the rooms, so a bottle on floor 8 looks as big as one on floor 1. What differs is who sees it: every player passes floor 1's one room, few reach floor 8's 16,384"
  - id: space-island
    type: sticky
    updated: [2026-11-11T12:20:14.000Z, agent:cube]
    box: [1368, 1930, 244, pink]
    icon: 🏝️
    text: "Vova's idea: join the cube with /island. Every island world holds one cube, which still has to be found"
  - id: graf-price-a
    type: sticky
    updated: [2026-11-11T12:20:14.000Z, agent:cube]
    box: [28, 2180, 244, pink]
    icon: 💵
    text: "1. Space is priced by volume: $160,000 a m³ on every floor, so $1 buys 6.25 cm³, a die ¾ in a side. A room halves on each axis a floor down, so it is ×8 cheaper: $10M for floor 1's one room, $4.77 on floor 8, ~$2·10⁻⁵² on 66. A whole floor halves, so the cube sums to just under $20M. Table and chart: https://claude.ai/artifact/8fawFUo5gSRn18X2qcxihj"
  - id: graf-price-b
    type: sticky
    updated: [2026-11-11T12:20:14.000Z, agent:cube]
    box: [363, 2180, 244, pink]
    icon: 📉
    text: '2. In theory, not to build: the price follows the path, not the floor number. The room above a hole and the room below it are seen by the same people, so they cost the same; the ×⅓ is spent walking from the landing to the next hole, and a dead end off the path is cheaper still'
  - id: graf-price-c
    type: sticky
    updated: [2026-11-11T12:20:14.000Z, agent:cube]
    box: [698, 2180, 244, pink]
    icon: 🏷️
    text: '3. Open: what a paid wall is. Forever at a high fixed price, as on the Million Dollar Homepage, or honest rent for a term at the price of its day. Not painted over: someone who paid $1000 is not told to find another wall'
  - id: graf-time
    type: sticky
    updated: [2026-11-11T12:20:14.000Z, agent:cube]
    box: [1033, 2180, 244, pink]
    icon: ⏳
    text: 'Time to cross floor n: ~5 s a room × 4^(n−1). Floor 6 ≈ 1.5 h (casual), 7 ≈ an evening, 8 ≈ a day, 10 ≈ 360 h. Reaching floor 7 takes ~2 h, the six above it summed'
