    box: [7128, 4800, 430]
    src: images/intro-31-entering-after-turn.webp
    text: '31. Climbing in after the quarter-turn: trees and bench straight ahead, the beam landing beside the bench, the hatch’s corner left in the dark. Re-shot: eye entering, the floor’s own lens, commit 001b3c9b, clock PLAY_INSTANT, 1280×800, pnpm outside:cube --eyes entering (frames 31–34 share these)'
  - id: intro-img-32-entering-fresh
