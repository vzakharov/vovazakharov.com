items:
  - id: z-intro
    type: zone
    updated: [2026-11-12T22:35:00.000Z, agent:cube-intro]
    box: [5720, -1000, 1880, 2100, orange]
    icon: 🏝️
    text: 'The intro: an island, the cube from outside, the way in'
  - id: intro-h-premise
    type: text
    updated: [2026-11-12T22:25:00.000Z, agent:cube-intro]
    box: [5748, -890, 1820, h2]
    text: The premise, beat by beat
  - id: intro-1
    type: sticky
    updated: [2026-11-12T22:25:00.000Z, agent:cube-intro]
    box: [5748, -820, 280, yellow]
    icon: 🌊
    text: 'You open your eyes, groan a little, sit up: a tiny sand island, nobody on it. «О твои ноги хлещут волны». Standing, you see only the sea at first'
  - id: intro-2
    type: sticky
    updated: [2026-11-12T22:25:00.000Z, agent:cube-intro]
    box: [6054, -820, 280, yellow]
    icon: ⬛
    text: 'You turn round. A few dozen metres off a cube hangs in the air, 5×5×5 m: black, with grey bands, each half the height that is left. «Материалы otherworldly, издают какой-то звук и не привычным глазу образом играют в предзакатном солнце»'
  - id: intro-3
    type: sticky
    updated: [2026-11-12T22:25:00.000Z, agent:cube-intro]
    box: [6360, -820, 280, yellow]
    icon: 🪜
    text: 'In the top band, a doorway with a room showing through it. And, «что совершенно не вяжется со всем этим», a perfectly ordinary ladder leaning to its sill. From here you walk: round the island, or out to sea, which has no edge yet'
  - id: intro-4
    type: sticky
    updated: [2026-11-12T22:25:00.000Z, agent:cube-intro]
    box: [6666, -820, 280, yellow]
    icon: 👀
    text: 'Come near the cube and you stoop to look under it: nothing there, nothing holds it. «Это нужно чтобы дать понять, что весь наш лабиринт действительно находится в одном кубе»'
  - id: intro-5
    type: sticky
    updated: [2026-11-12T22:25:00.000Z, agent:cube-intro]
    box: [6972, -820, 280, yellow]
    icon: 🚪
    text: 'E at the ladder: you climb, and through the doorway you are in floor 1’s room. Where the door was is the opening; no lamps, only the low sun through it. The office stays as it was, plant included: «Пусть будет, тем комичнее. Солнце должно играть "об него"»'
  - id: intro-6
    type: sticky
    updated: [2026-11-12T22:25:00.000Z, agent:cube-intro]
    box: [7278, -820, 280, yellow]
    icon: 💊
    text: 'The lever becomes a pill on a small shelf at the same height: pick up, to the mouth, a swallow, and you shrink as before. The first time you turn it over in your hand first, and a prompt asks: “Press Y to drink, N to put down”'
  - id: intro-h-staging
    type: text
    updated: [2026-11-12T22:25:00.000Z, agent:cube-intro]
    box: [5748, -400, 1820, h2]
    text: Staging decisions, and where the sea comes from
  - id: intro-d1
    type: sticky
    updated: [2026-11-12T22:35:00.000Z, agent:cube-intro]
    box: [5748, -330, 280, blue]
    icon: ☀️
    text: 'The doorway faces the sun, and you wake on the cube’s far side, ~30 m south-west, the sun behind it: turning, you see the cube against the sunset, door and ladder out of sight. Vova: «иначе ты сразу видишь дверь и лестницу in your face, это не так интересно». Waking in front of the doorway lost to this'
  - id: intro-d2
    type: sticky
    updated: [2026-11-12T22:35:00.000Z, agent:cube-intro]
    box: [6054, -330, 280, blue]
    icon: 🕴️
    text: 'The cube hovers 1.1 m over the sand. With the sun 9° up its shadow starts ~7 m behind it and runs some 38 m, beside your way to the cube. So the look under, from the shadow side, shows sand in full sun and the sea’s glare through the gap'
  - id: intro-d3
    type: sticky
    updated: [2026-11-12T22:25:00.000Z, agent:cube-intro]
    box: [6360, -330, 280, blue]
    icon: 🌇
    text: 'Eternal golden hour: the sun never moves. Waves, clouds and surf do, as functions of the clock, so a frame is a function of where you stand and when'
  - id: intro-d4
    type: sticky
    updated: [2026-11-12T22:35:00.000Z, agent:cube-intro]
    box: [6666, -330, 280, blue]
    icon: 🪴
    text: 'The doorway is where floor 1’s decor door stood: the east wall by the north-east corner, 0.97 m wide, 2.1 m tall. The potted plant stands half across it and stays. The beam through it crosses the room and ends low on the west wall'
  - id: intro-d5
    type: sticky
    updated: [2026-11-12T22:35:00.000Z, agent:cube-intro]
    box: [6972, -330, 280, blue]
    icon: 💧
    text: 'One function says where the water is: waterLevel(xz, t), the sea’s slow surface with surge and swash. The sea, the sand’s wet band, the surf’s sound and the waves on your feet all read it, which is what keeps them in step'
  - id: intro-d6
    type: sticky
    updated: [2026-11-12T22:35:00.000Z, agent:cube-intro]
    box: [7278, -330, 280, blue]
    icon: 🙌
    text: 'The stylised hands stay as they are. Vova: «контраст между ослепительным реализмом предзакатного острова и недореализмом остального -- будем считать творческим выбором»'
  - id: intro-img-web-ocean
    type: image
    updated: [2026-11-12T22:35:00.000Z, agent:cube-intro]
    box: [5748, 40, 440]
    src: images/intro-web-ocean.webp
    text: 'From the Island board (item web-ocean): “Inspiration: Noniv/web-ocean — what a browser can do with sea and sky. Nothing copied.” The same goes here'
  - id: intro-world
    type: sticky
    updated: [2026-11-12T22:35:00.000Z, agent:cube-intro]
    box: [6214, 40, 280, green]
    icon: 🗺️
    text: 'One ocean, one day. Vova: «это всё станет частью одного мира: наш остров посреди океана в том же мире, где остров Золтана и Сямы. Если поплывёшь -- через сотни километров доплывёшь до берега. А может и взлетишь. Но это потом :)»'
  - id: intro-h-frames
    type: text
    updated: [2026-11-12T22:35:00.000Z, agent:cube-intro]
    box: [5748, 480, 1820, h2]
    text: 'The timelapse: frames as they come, failures included'
