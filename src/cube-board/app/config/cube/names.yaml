items:
  - id: z-names
    type: zone
    updated: [2026-11-11T06:38:01.000Z, agent:cube]
    box: [0, 1000, 3540, 720, orange]
    icon: 📛
    text: What to call it
  - id: img-67levels
    type: image
    updated: [2026-11-11T07:30:00.000Z, agent:cube]
    box: [28, 1110, 600]
    src: images/unsquatted-67levels.webp
    text: "Vova's near-pick, now that there are 67 levels: 67levels.com, free at $12/yr"
  - id: img-level67
    type: image
    updated: [2026-11-11T07:30:00.000Z, agent:cube]
    box: [1705, 1400, 380]
    src: images/unsquatted-level67.webp
    text: 'The one that sounds better: level67.com, taken since 2015; .net and .org are free'
  - id: names-count
    type: sticky
    updated: [2026-11-11T07:30:00.000Z, agent:cube]
    box: [700, 1110, 244, orange]
    icon: 🔢
    text: 'The count: 67levels, Level 67, Floor 67, Sixty-Seven Down. Says how deep it goes and reads as a game; hides that you shrink'
  - id: names-half
    type: sticky
    updated: [2026-11-11T06:38:01.000Z, agent:cube]
    box: [1035, 1110, 244, orange]
    icon: ➗
    text: 'The halving: Half Again, Halfway Down, Ever Smaller, Halfsize. Names the one mechanic nobody else has'
  - id: names-zeno
    type: sticky
    updated: [2026-11-11T06:38:01.000Z, agent:cube]
    box: [1370, 1110, 244, orange]
    icon: 🐢
    text: "Zeno: Zeno's Cube, Dichotomy. The paradox of halving forever and never arriving is the whole game in two words"
  - id: names-never
    type: sticky
    updated: [2026-11-11T06:38:01.000Z, agent:cube]
    box: [1705, 1110, 244, orange]
    icon: 🔒
    text: 'The lock: Nevermaze, Always Never, The Patient Door, Unfinishable. Sells the promise: finishable, and never finished'
  - id: names-hash
    type: sticky
    updated: [2026-11-11T06:38:01.000Z, agent:cube]
    box: [2040, 1110, 244, orange]
    icon: '#️⃣'
    text: 'The hash: Hashmaze, Preimage, Golden Nonce, Proof of Walk. For readers who know bitcoin; opaque to the rest'
  - id: names-hole
    type: sticky
    updated: [2026-11-11T06:38:01.000Z, agent:cube]
    box: [2375, 1110, 244, orange]
    icon: 🕳️
    text: 'The hole: The Hatch, One Hole Down, Downhatch. What the player hunts on every floor'
  - id: names-nest
    type: sticky
    updated: [2026-11-11T06:38:01.000Z, agent:cube]
    box: [2710, 1110, 244, orange]
    icon: 🪆
    text: 'Nesting: Matryoshka Cube, The Cube Within, Innermost, Smaller Inside. The same cube from outside, ever deeper'
  - id: names-planck
    type: sticky
    updated: [2026-11-11T06:38:01.000Z, agent:cube]
    box: [3045, 1110, 244, orange]
    icon: 🔭
    text: 'Scale: Toward Planck, Planck Floor, Proton Room. Floor 53 is smaller than a proton; the bottom, past Planck'
  - id: names-endless
    type: sticky
    updated: [2026-11-11T06:38:01.000Z, agent:cube]
    box: [1035, 1400, 244, orange]
    icon: 🌌
    text: 'Endless: Endless Down, No Bottom, Infinite Floors. Floor heights halve, so infinitely many still fit in one cube; past 64 is the same never, only longer'
  - id: names-67
    type: sticky
    updated: [2026-11-11T06:38:01.000Z, agent:cube]
    box: [1370, 1400, 244, orange]
    icon: 💥
    text: 'The pitch Vova picked: «get to floor 67, piece of cake». SIX SEVEN. Nobody ever will, and whoever does gets the most anticlimactic ending in video games: floor 67 really crashes'
  - id: names-cubed-away
    type: sticky
    updated: [2026-11-13T11:55:00.000Z, agent:cube-intro]
    box: [3045, 1400, 244, orange]
    icon: 🎬
    text: 'Working titles: “cubed away” (a nod to Spirited Away) and “cubeaway” (a nod to The Castaway). Vova likes the sound of “cubed away” best; not a decision on the title'
  - id: names-note
    type: sticky
    updated: [2026-11-11T07:30:00.000Z, agent:cube]
    box: [700, 1400, 244, gray]
    icon: 📝
    text: Only 67levels and level67 are checked for domains; the rest go through Unsquatted before any of them counts
