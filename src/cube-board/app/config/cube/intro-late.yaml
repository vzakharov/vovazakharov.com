items:
  - id: intro-h-whole-1200
    type: text
    updated: [2026-11-13T12:10:00.000Z, agent:cube-intro]
    box: [5748, 5700, 2200, h2]
    text: Where the whole stands, 12:00Z
  - id: intro-img-35-whole-wake-cube
    type: image
    updated: [2026-11-13T12:10:00.000Z, agent:cube-intro]
    box: [5748, 5780, 430]
    src: images/intro-35-whole-wake-cube.webp
    text: '35. The first frame a player sees, lying on the sand: the cube over the dune’s crest against the sun, its shadow across the ripples. From lying, the crest hides the gap under the cube; it opens on standing up. Open: thin dark arcs on the sand bottom-left read as pen strokes (with sand; fixed, see frames 42 and 43). Eye wake-cube, commit 49186bc5'
  - id: intro-img-36-whole-wake-sea
    type: image
    updated: [2026-11-13T12:10:00.000Z, agent:cube-intro]
    box: [6208, 5780, 430]
    src: images/intro-36-whole-wake-sea.webp
    text: '36. The same spot, toward the sea. Open: hard blue dots on the shallows inside the cube’s shadow, and a flat white bar at the horizon on the right (both with sea). Eye wake-sea, commit 49186bc5'
  - id: intro-img-37-whole-ladder-foot
    type: image
    updated: [2026-11-13T12:10:00.000Z, agent:cube-intro]
    box: [6668, 5780, 430]
    src: images/intro-37-whole-ladder-foot.webp
    text: '37. Up the wooden ladder to the doorway; the ladder’s shadow lies on the face, the room’s ceiling shows through the opening. Open: the operator finds the band between the black faces “construction grey — it used to be more mysterious”. Shell is shooting three variants (dark as in the morning, deep graphite satin, today’s) from two eyes; the operator picks. Eye ladder-foot, commit 49186bc5'
  - id: intro-img-38-whole-under
    type: image
    updated: [2026-11-13T12:10:00.000Z, agent:cube-intro]
    box: [7128, 5780, 430]
    src: images/intro-38-whole-under.webp
    text: '38. Under the cube, looking up: black with the specks the operator said stay. Eye under, commit 49186bc5'
  - id: intro-img-39-whole-room-doorway
    type: image
    updated: [2026-11-13T12:10:00.000Z, agent:cube-intro]
    box: [7588, 5780, 430]
    src: images/intro-39-whole-room-doorway.webp
    text: '39. Floor 1 toward its doorway after the quarter-turn and the clear-strip rule: nothing stands in the opening. Open: the bench in the beam casts no shadow yet (shell and pill are giving the beam the decor’s boxes). Eye room-doorway, floor 1’s own lens, commit 874eab51. Frames 35 to 39: clock PLAY_INSTANT 2026-11-01T12:00:00Z, 1280×800, re-shot with pnpm outside:cube --eyes <name>'
  - id: intro-img-40-whole-doorway-out
    type: image
    updated: [2026-11-13T12:20:00.000Z, agent:cube-intro]
    box: [5748, 6250, 430]
    src: images/intro-40-whole-doorway-out.webp
    text: '40. What a player sees turning round on floor 1’s sill: the sun and its path on the water, the shore’s arc, the dune below. The notice board that used to hang across this opening is gone (frames 29–30 show it). Eye doorway-out, eyes used to daylight (indoors 0), commit b0852de6; pose: u 0.8482, v 0.97, eye 0.32 above, yaw π/2, elevation 0, exposure 0.3, eyelids 1; clock PLAY_INSTANT; the same fields are in the .shot.json beside the file on the lead’s branch'
  - id: intro-img-41-whole-doorway-down
    type: image
    updated: [2026-11-13T12:20:00.000Z, agent:cube-intro]
    box: [6208, 6250, 430]
    src: images/intro-41-whole-doorway-down.webp
    text: '41. The same sill, looking down at the sand; the ladder is just under the frame’s lower edge. Eye doorway-down, elevation −0.7, otherwise as frame 40, commit b0852de6'
  - id: intro-img-42-weed-before-after
    type: image
    updated: [2026-11-13T12:25:00.000Z, agent:cube-intro]
    box: [6668, 6250, 520]
    src: images/intro-42-weed-before-after.webp
    text: '42. The dried weed by the waker’s cheek, bottom left of the first frame a player sees, at 3×: above as even dark arcs that read as pen strokes, below tapered, unevenly bent, black to straw, each with a short shadow, and a third fewer'
  - id: intro-img-43-weed-wake-cube
    type: image
    updated: [2026-11-13T12:25:00.000Z, agent:cube-intro]
    box: [7248, 6250, 430]
    src: images/intro-43-weed-wake-cube.webp
    text: '43. The waking frame after the weed fix. Eye wake-cube (pnpm outside:cube --eyes wake-cube: lying at the waking spot, yaw −45°, pitch 8.02°), clock PLAY_INSTANT 2026-11-01T12:00:00Z (1793534400000 ms), 1280×800 at device scale 1, commit 69ac8423 on the sand branch'
  - id: intro-img-44-after-room-doorway
    type: image
    updated: [2026-11-13T12:30:00.000Z, agent:cube-intro]
    box: [7128, 5250, 430]
    src: images/intro-44-after-room-doorway.webp
    text: '44. After pill’s clear zone: the way in is a way in again (the notice board of frame 29 hangs on the wall beside the opening). Eye room-doorway, commit 001b3c9b, clock PLAY_INSTANT, 1280×800'
  - id: intro-img-45-after-doorway-out
    type: image
    updated: [2026-11-13T12:30:00.000Z, agent:cube-intro]
    box: [7588, 5250, 430]
    src: images/intro-45-after-doorway-out.webp
    text: '45. …and the sill has its view back (frame 30 shows the cork). Eye doorway-out, commit 001b3c9b, clock PLAY_INSTANT, 1280×800'
  - id: intro-img-24-pill-shelf-4x
    type: image
    updated: [2026-11-13T11:40:00.000Z, agent:cube-intro]
    box: [7128, 3700, 600]
    src: images/intro-24-pill-shelf-4x.webp
    text: '24. The pill on its shelf at 4×, on floors 2, 5, 7 and 1 (left to right, top to bottom). The red ledge and the pale paper under the pill are what make the shelf findable on every floor, the dark server hall of floor 7 included. Under room light the pill’s black half has no highlight yet and reads flat; the glint is being added in the renderer'
  - id: intro-img-19-sky-wet-foreshore
    type: image
    updated: [2026-11-13T11:15:00.000Z, agent:cube-intro]
    box: [5748, 3250, 430]
    src: images/intro-19-sky-wet-foreshore.webp
    text: '19. Standing on the wet foreshore toward the sun: the wet sand mirrors the sky and carries the sun’s glare, brighter the further it lies. Open: close to the eye the band stays dark. Re-shoot: eye x −19.2, z 19.2, 1.6 m over the bed, yaw −31, pitch −10; same clock and commit as frame 20'
  - id: intro-img-20-sky-approved-eye
    type: image
    updated: [2026-11-13T11:35:00.000Z, agent:cube-intro]
    box: [5748, -3040, 1200]
    src: images/intro-20-sky-approved-eye.webp
    text: '20. Splash screen, for the future. The approved eye under the new sky: gold sand, ripples in fields across the view, white sparks, the cube’s shadow violet-blue. The operator approved it for its overall feeling: “AAAA, give me two!” The sand’s shade is not locked: “you can experiment with the sand’s shades if you like, I am talking about the overall feeling”. Open: the inside of the shadow is still even'
  - id: intro-splash-frame-20
    type: sticky
    updated: [2026-11-13T11:35:00.000Z, agent:cube-intro]
    box: [6990, -3040, 560, pink]
    icon: 🖼️
    text: 'For the future: this frame should be the splash screen. — Vova. (Nothing is being built for it now.) To re-shoot it exactly: eye at −15.203, 2.0962, 15.203 (the bed there + 1.6 m; 2.10 is the rounded value), yaw −45, pitch 4, roll 0; viewport 1280×800 at device scale 1, default lens; the clock pinned at PLAY_INSTANT = 2026-11-01T12:00:00Z (1793534400000 ms); the sun does not move with the clock; commit f0ff9882 on the sand branch (merged into the lead as 43c24a67); command: pnpm outside:cube --at -15.203,2.0962,15.203 --yaw -45 --pitch 4'
  - id: intro-img-ref-approved
    type: image
    updated: [2026-11-13T11:35:00.000Z, agent:cube-intro]
    box: [6208, 3250, 430]
    src: images/intro-ref-approved.webp
    text: 'The same eye under the earlier, cloudless sky; a frame of the island the operator approved (his first frame is the sea one in this zone’s top block): standing on the beach toward the sun, the cube over the crest, its shadow running left, the ladder and the sun’s glitter under it. Every package now compares its passes against this frame. Eye: 21.5 m south-west of the cube’s middle, looking at it'
  - id: intro-ref-verdict
    type: sticky
    updated: [2026-11-13T11:35:00.000Z, agent:cube-intro]
    box: [6668, 3250, 280, pink]
    icon: 🔥
    text: 'Vova, on seeing it: “this is properly top, it can go on the board”'
  - id: intro-ref-gold-eye
    type: image
    updated: [2026-11-13T10:55:00.000Z, agent:cube-intro]
    box: [7000, -2880, 590]
    src: images/intro-ref-gold-eye.webp
    text: 'The same eye after sand’s next pass: the lit sand went from pinkish beige to gold, and the ripples now run across the view instead of toward the cube. Vova approved the earlier pinkish frame (now at the bottom of this zone, beside frame 19) and later frame 20 for its feeling; the sand’s shade is not locked'
  - id: intro-ref-gold-lying
    type: image
    updated: [2026-11-13T10:55:00.000Z, agent:cube-intro]
    box: [7620, -2880, 590]
    src: images/intro-ref-gold-lying.webp
    text: 'What the player sees on waking, lying down: the cube sits on the dune’s crest; it floats only once you stand up. Known flaw: a pink smear under the cube’s lower edge, being traced'
  - id: intro-d-wake-inland
    type: sticky
    updated: [2026-11-13T10:30:00.000Z, agent:cube-intro]
    box: [6868, 2350, 280, blue]
    icon: 🏖️
    text: 'The waking spot moves ~8 m inland. Measured by sea: it sat exactly on the still waterline, and the swash runs 4.7 m up the beach, so the first frames with the real ocean woke the player under water'
  - id: intro-d-eye
    type: sticky
    updated: [2026-11-13T10:30:00.000Z, agent:cube-intro]
    box: [7174, 2350, 280, blue]
    icon: 👁️
    text: 'The eye adapts by where it looks: 0.5 s toward light, 6 s toward dark (“this is not a speed game”); looking at the doorway holds it to daylight'
  - id: intro-q-beam-pill
    type: sticky
    updated: [2026-11-13T10:30:00.000Z, agent:cube-intro]
    box: [6868, 2700, 586, yellow]
    icon: ❓
    text: 'Open question: the beam and the pill. The operator: “if it lights exactly the pill and the way down, that is too fast a reveal.” Three ways: move the shelf and/or the hole, turn the sun, turn the cube. “Which is right I cannot say offhand — it has to be looked at and compared.” Shell is shooting all three; the choice is the operator’s'
  - id: intro-h-round
    type: text
    updated: [2026-11-13T13:50:00.000Z, agent:cube-intro]
    box: [5748, 6820, 2200, h2]
    text: 'After Vova’s first walk of the preview, 13 Nov: the scenario round'
  - id: intro-r-verdict
    type: sticky
    updated: [2026-11-13T13:50:00.000Z, agent:cube-intro]
    box: [5748, 6900, 280, pink]
    icon: 🚶
    text: 'Vova, after walking it on an M2 Pro: “a joy, but alas outside (and until the way down to floor two) it is very slow.” Then a list: the scenario first, the speed after.'
  - id: intro-r-first-look
    type: sticky
    updated: [2026-11-13T13:50:00.000Z, agent:cube-intro]
    box: [6054, 6900, 280, blue]
    icon: 👀
    text: 'The first look is the player’s. The waking ends looking out to sea and nothing turns the head. The frame the whole cube first comes into view, the hero says “hm?”'
  - id: intro-r-pace
    type: sticky
    updated: [2026-11-13T13:50:00.000Z, agent:cube-intro]
    box: [6360, 6900, 280, blue]
    icon: 🏃
    text: 'A body walks unless Shift says run, indoors and out. Held, Shift gives the other pace; two quick taps make it the standing one. Coming down to floor 3 a line says “Hold Shift to run, double-tap to keep running”, until Shift is first pressed'
  - id: intro-r-climb
    type: sticky
    updated: [2026-11-13T13:50:00.000Z, agent:cube-intro]
    box: [6666, 6900, 280, blue]
    icon: 🪜
    text: 'On the ladder the eye looks aside on the way up and straight ahead again before the doorway, so entering no longer lands the gaze on the hatch. Hands on the rungs: the eye stood 0.78 m from them against a 0.7 m arm, which is why none showed; it stands a forearm off now'
  - id: intro-r-refused
    type: sticky
    updated: [2026-11-13T13:50:00.000Z, agent:cube-intro]
    box: [6972, 6900, 280, blue]
    icon: 🕳️
    text: 'No jumping off the first time. The eye leans out over the sill, looks down at where the ladder stood, the line says “The ladder is gone”, the hero says “hm?”, and the body is back inside. Let go of the keys and the next step is the jump'
  - id: intro-r-reload
    type: sticky
    updated: [2026-11-13T13:50:00.000Z, agent:cube-intro]
    box: [7278, 6900, 280, blue]
    icon: 🔁
    text: 'Reloading. Once the waking has played the address carries #awake, and a reload starts on the island already up. Jumping off writes nothing, so a reload after it starts inside'
  - id: intro-r-cost
    type: sticky
    updated: [2026-11-13T14:30:00.000Z, agent:cube-intro]
    box: [5748, 7250, 586, yellow]
    icon: ⏱️
    text: 'Why it is slow outside. GPU time for the scene, M2 Pro, a window of 3570×2300 device pixels: waking (half sand, half sky) 59.5 ms; the sea filling the lower half 43.8; floor 1’s room, the outside seen through the doorway alone, 42.6; the cube close up 28.2; floor 2 3.6. So it is not the ocean’s simulation, nor the seam where the sea meets the sand: it is every pixel of sand and of sea, and floor 1 pays for all of them behind its walls. For now there are three qualities out of doors, cycled on Q: the picture at 1, 0.75 or 0.5 of the screen’s resolution, starting at the highest, and a line names the key once the outside draws under 55 frames a second. Deeper floors are always sharp: the level lifts in the fall through floor 1’s hole. The clouds keep their own grid at every level; at half the picture they had turned to bricks'
  - id: intro-r-steps
    type: sticky
    updated: [2026-11-13T14:30:00.000Z, agent:cube-intro]
    box: [6972, 7250, 280, blue]
    icon: 👣
    text: 'A run sounded like a toddler: a footfall every 0.75 m at any pace is 4.7 a second at a run. Vova: “it should be what a walk is now.” A run’s stride is two and a half walking ones, so both paces step 1.9 times a second, the run landing harder'
  - id: intro-todo-hidden
    type: sticky
    updated: [2026-11-13T14:30:00.000Z, agent:cube-intro]
    box: [5748, 7700, 280, orange]
    icon: 🙈
    text: 'To do, the outside’s cost, cheapest first. 1: shade nothing hidden. Rooms and shell first, sand and sea only where they show. Floor 1’s room stops paying 42.6 ms for a beach behind its walls. In the way: the sea writes its own depth, which rules the early depth test out as it stands'
  - id: intro-todo-sand-far
    type: sticky
    updated: [2026-11-13T14:30:00.000Z, agent:cube-intro]
    box: [6054, 7700, 280, orange]
    icon: 🔭
    text: 'To do, 2: thin the sand with distance. Every pixel works out grains and glints, ripples and hummocks, the wrack’s litter, the wetness of past waves, the cube’s shadow and the wet mirror. Past a few metres the grains, glints and litter are already averaged away; whether the shader skips that work or does it and blends it out is unread'
  - id: intro-todo-sand-bake
    type: sticky
    updated: [2026-11-13T14:30:00.000Z, agent:cube-intro]
    box: [6360, 7700, 280, orange]
    icon: 🍞
    text: 'To do, 3: bake what the clock does not move. Grains, ripples, hummocks and litter worked out once at load, by the same formulas, into maps the GPU keeps, and only read each frame; wetness, shadow and light stay per frame. A map computed at run time is allowed by the rules. The price: memory, and a pattern that may repeat; the sand at one’s feet can stay the honest sum'
  - id: intro-todo-small-target
    type: sticky
    updated: [2026-11-13T14:30:00.000Z, agent:cube-intro]
    box: [6666, 7700, 280, orange]
    icon: 🔍
    text: 'To do, 4: the sand and the sea alone in a smaller picture, joined to the sharp cube, ladder and hands by depth, as the clouds already are. Vova asked for it: “couldn’t we descale only that?” Without the join by depth there is a halo round everything that stands in front'
  - id: intro-todo-measure
    type: sticky
    updated: [2026-11-13T14:30:00.000Z, agent:cube-intro]
    box: [6972, 7700, 280, orange]
    icon: 📏
    text: 'To do before any of them: find which term of the sand is the dearest, turning them off one at a time under the meter on Vova’s machine. The meter’s stages overlap on Apple’s GPU (scene plus lens come to more than the frame), so the lens figure is not a cost to chase by itself'
  - id: intro-r-bench
    type: sticky
    updated: [2026-11-13T13:50:00.000Z, agent:cube-intro]
    box: [6360, 7250, 280, green]
    icon: 🪑
    text: 'The bench in floor 1’s beam stood dark while the wall behind it was lit: a box that shades the room from the sun also shaded every point inside itself. A point within a box takes no shade from it now'
  - id: intro-r-wave
    type: sticky
    updated: [2026-11-13T13:50:00.000Z, agent:cube-intro]
    box: [6666, 7250, 280, green]
    icon: 🌊
    text: 'Under a wave the picture was a flat pale grey: whatever lay under the horizon behind the water was drawn as if in air. Vova: “no need to make it beautiful now, but at least not grey.” It takes the colour of the water’s body with distance'
