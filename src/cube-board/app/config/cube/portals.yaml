items:
  - id: z-portals
    type: zone
    updated: [2026-11-15T11:02:33.000Z, agent:cube]
    box: [5720, 2000, 2470, 2400, blue]
    icon: 🌀
    text: 'Portals: the forks'
  - id: p-look-q
    type: sticky
    updated: [2026-11-15T11:03:33.000Z, agent:cube]
    box: [5748, 2110, 380, blue]
    icon: 🚪
    text: 'Fork 1, the look: (a) the sci-fi portal; (b) the far room seen straight through the doorway; (c) something else. Vova on (b): how would you tell it is a portal, and you do not shrink'
  - id: p-look-a
    type: sticky
    updated: [2026-11-15T11:04:33.000Z, agent:cube]
    box: [5748, 2280, 380, gray]
    icon: 🚫
    text: '(a), a glowing swirl, out by tone rather than by the rules, which allow a swirl computed in a shader. It announces itself from across the room, and the cube’s doors work by being ordinary until opened: the coat rack on floor 8 was uncanny in the good sense because nothing warned you'
  - id: p-look-scale
    type: sticky
    updated: [2026-11-15T11:05:33.000Z, agent:cube]
    box: [5748, 2510, 380, yellow]
    icon: 🏠
    text: '(c), (b) at true scale: a door like any other, and opened it shows the far room at the size it really has from here. Five floors down is 32 times smaller: a dollhouse on the threshold, its front wall missing, darkness round it. Five up is 32 times bigger: a skirting board taller than you and the pile of a carpet. The size is the tell, and it answers the shrinking: you have not shrunk yet'
  - id: p-look-far
    type: sticky
    updated: [2026-11-15T11:06:33.000Z, agent:cube]
    box: [5748, 2800, 380, yellow]
    icon: ✨
    text: 'A far jump shows almost nothing: twenty floors down, the room is a millionth of the doorway, under a pixel. So the doorway holds a dark closet and one point of light, the far room’s light summed, in its theme’s colour. The smaller the star, the further; the colour says where'
  - id: p-look-render
    type: sticky
    updated: [2026-11-15T11:07:33.000Z, agent:cube]
    box: [5748, 3030, 380, purple]
    icon: 🖥️
    text: 'The cost: while a portal door stands open, a second room is drawn inside the doorway, clipped to its opening, with the room really behind the wall left out there. One extra room, only while the door is open and only through it'
  - id: p-look-pick
    type: sticky
    updated: [2026-11-15T11:08:33.000Z, agent:cube]
    box: [5748, 3230, 380, green]
    icon: ✅
    text: 'Leaning to (c). “Open every door” gets its reason: shut, a portal is any door, and opening it is the reveal'
  - id: p-pass-q
    type: sticky
    updated: [2026-11-15T11:09:33.000Z, agent:cube]
    box: [6158, 2110, 380, blue]
    icon: 🌀
    text: 'Fork 2, the crossing: a flight down a wormhole, some effect, or nothing at all'
  - id: p-pass-grow
    type: sticky
    updated: [2026-11-15T11:10:33.000Z, agent:cube]
    box: [6158, 2280, 380, yellow]
    icon: 📏
    text: 'The crossing is the change of size, tied to where you stand: across the doorway’s depth your size slides from this floor’s to the far one’s, and the dollhouse grows to meet you. Step back halfway and you grow back; only past the threshold does the URL change. No tunnel, no cut, no loading'
  - id: p-pass-long
    type: sticky
    updated: [2026-11-15T11:11:33.000Z, agent:cube]
    box: [6158, 2520, 380, yellow]
    icon: 🍄
    text: 'A long jump sweeps the floors between, as deep-fall has it: depth run through airAt, every theme passed flashing by. A short one only grows or shrinks. About 0.1 s a floor and never under 0.6 s, so thirty floors take three seconds'
  - id: p-pass-free
    type: sticky
    updated: [2026-11-15T11:12:33.000Z, agent:cube]
    box: [6158, 2730, 380, purple]
    icon: 👁️
    text: 'What is already built does the rest: the drowsy eye’s blend smears the sweep for free, and the far floor’s sound comes through the open door pitched by its scale, a smaller room ringing higher and a bigger one lower, sliding as you cross'
  - id: p-pass-pick
    type: sticky
    updated: [2026-11-15T11:13:33.000Z, agent:cube]
    box: [6158, 2950, 380, green]
    icon: ✅
    text: 'Leaning to no wormhole: the change of size is the passage, and walking through it is the effect'
  - id: p-where-q
    type: sticky
    updated: [2026-11-15T11:14:33.000Z, agent:cube]
    box: [6568, 2110, 380, blue]
    icon: 🎯
    text: 'Fork 3, where to and how often, and up as well as down or down only'
  - id: p-where-odds
    type: sticky
    updated: [2026-11-15T11:15:33.000Z, agent:cube]
    box: [6568, 2280, 380, yellow]
    icon: 🎲
    text: 'How often: a share of doors, not a count per floor. A player meets ~50 doors an hour on any floor (doors-threshold), so a share is an hourly rate: from floor 7, 2% of doors, one portal an hour; rising to ~10% by floor 20, one every 12 minutes, so the deep, reached only by portal, keeps a way on'
  - id: p-where-to
    type: sticky
    updated: [2026-11-15T11:16:33.000Z, agent:cube]
    box: [6568, 2520, 380, yellow]
    icon: 🗺️
    text: 'Where: any floor but your own, all alike, the last one too (deep-win). From floor 7 that is 9 in 10 down; from floor 40, 6 in 10 up. Alike shows every theme equally, which is what the deep zone is for; favouring short jumps would show again what legs already reach. The room on that floor is rolled too'
  - id: p-where-roll
    type: sticky
    updated: [2026-11-15T11:17:33.000Z, agent:cube]
    box: [6568, 2760, 380, purple]
    icon: 🔢
    text: 'Rolled per door: doorway/{floor}/{partition}/portal says whether, …/to which floor, …/room which room. Fixed for good, so a door always leads to the same place and a shared map of portals spoils nothing: arriving by portal is not a trophy (deep-stack)'
  - id: p-where-ask
    type: sticky
    updated: [2026-11-15T11:18:33.000Z, agent:cube]
    box: [6568, 2980, 380, gray]
    icon: ❓
    text: 'For Vova: deep-out ruled out odds per room, for burying the one hatch under thousands of doors. A share of doors is odds per room. I would take it anyway: on floor 30 the hatch is out of reach whatever the doors do, and a fixed count on a floor of 2^58 rooms means whoever arrives there never meets a second portal'
  - id: p-way-q
    type: sticky
    updated: [2026-11-15T11:19:33.000Z, agent:cube]
    box: [6978, 2110, 380, blue]
    icon: ↔️
    text: 'Fork 4, one-way or two-way. One-way: a fixed random spot on the far floor, shut behind you, the browser’s Back the worst-case way home. Two-way: out through a door on the other floor, and the same door leads back. Plus the math: how to make pairs that point at each other'
  - id: p-way-pairs
    type: sticky
    updated: [2026-11-15T11:20:33.000Z, agent:cube]
    box: [6978, 2320, 380, purple]
    icon: 🧮
    text: 'The pairing is easy: roll each pair of floors {a, b}, a < b, under one path, and both ends read the same record, so each points at the other by construction. The counts are what break: every pair has one end on each floor, so a and b hold as many a–b doors each, while floor 30 has 4^28 times the rooms of floor 2'
  - id: p-way-count
    type: sticky
    updated: [2026-11-15T11:21:33.000Z, agent:cube]
    box: [6978, 2560, 380, purple]
    icon: 📉
    text: 'In numbers: one portal an hour on floor 30 is ~10^15 portals there. Two-way, a 65th of them end on floor 2, ~10^13 doors in each of its four rooms. So two-way leaves deep portals rare, or linking only floors close in size, and either kills the long jump. One-way lets each floor set its own rate'
  - id: p-way-thread
    type: sticky
    updated: [2026-11-15T12:07:33.000Z, agent:cube]
    box: [6978, 2970, 380, yellow]
    icon: 🧵
    text: 'So one-way, and the way back is not in the maze but in your hand, as your body is yours: a thread, run out from the door you came through. Pull it and the crossing plays backwards, the room you left growing round you again. Nothing in either room changes, and nobody else can follow it'
  - id: p-way-door-out
    type: sticky
    updated: [2026-11-15T12:06:33.000Z, agent:cube]
    box: [6978, 2790, 380, gray]
    icon: 🚫
    text: 'Ruled out, Vova: a door back that only the traveller sees. The maze is the same for every player, and a door there for one of them is a free change of state. A door for everyone is two-way again'
  - id: p-way-stack
    type: sticky
    updated: [2026-11-15T12:08:33.000Z, agent:cube]
    box: [6978, 3220, 380, yellow]
    icon: 🥞
    text: 'Pulling the thread is deep-stack’s pop: crossing pushes the room you stood in onto the URL, the thread pops it, and the browser’s Back is the same pop, so the worst case is the ordinary case. Through a second portal, the second thread is in your hand; pull it, and the first is in your hand again'
  - id: p-way-pick
    type: sticky
    updated: [2026-11-15T12:09:33.000Z, agent:cube]
    box: [6978, 3450, 380, green]
    icon: ✅
    text: 'Leaning to one-way, the way back in your hand and not in a wall, as deep-thread had it on 13 Nov'
  - id: p-more-q
    type: sticky
    updated: [2026-11-15T11:25:33.000Z, agent:cube]
    box: [7388, 2110, 380, blue]
    icon: ➕
    text: 'Forks not yet named'
  - id: p-more-gaps
    type: sticky
    updated: [2026-11-15T11:26:33.000Z, agent:cube]
    box: [7388, 2240, 380, yellow]
    icon: 🕳️
    text: 'Doors only, or gaps too? A gap that is a portal shows its dollhouse from across the room, always open. Doors only, so the reveal stays something you do; a rare portal gap could be the one you see coming'
  - id: p-more-objects
    type: sticky
    updated: [2026-11-15T11:27:33.000Z, agent:cube]
    box: [7388, 2440, 380, yellow]
    icon: 🛏️
    text: 'Doors only, or the signature entries too (deep-beds, deep-drawing)? Those lead to a chosen theme, a door to a random floor. They can wait: a door is the portal that needs no new object'
  - id: p-more-landing
    type: sticky
    updated: [2026-11-15T12:10:33.000Z, agent:cube]
    box: [7388, 2630, 380, yellow]
    icon: 🧍
    text: 'Landing: which way you face, and against what. Back to a rolled wall of the rolled room, facing in, so the first sight is the whole room; rolled among the walls a door may stand on, which decor already keeps clear'
  - id: p-more-trophy
    type: sticky
    updated: [2026-11-15T11:29:33.000Z, agent:cube]
    box: [7388, 2830, 380, purple]
    icon: 🏆
    text: 'What arriving counts for: nothing toward the trophy, the deepest honest hatch (deep-stack). A portal moves the position only, so a portal to the last floor is a view of it, not the win; the win stays the fall through its hole'
  - id: p-more-two
    type: sticky
    updated: [2026-11-15T11:30:33.000Z, agent:cube]
    box: [7388, 3030, 380, gray]
    icon: 👥
    text: 'Two players: the dollhouse is seen by whoever sees the door open, so by its opener alone, as doors-who-sees has it. A second player cannot follow the first through, since for them the door is shut'
  - id: p-period-q
    type: sticky
    updated: [2026-11-15T13:48:01.000Z, agent:cube]
    box: [7798, 2110, 380, blue]
    icon: ⏱️
    text: 'Fork 5, the hub’s period. In the hub-and-spoke model (the doors artifact) a hub rolls where it leads once a period, on one clock for every hub, and a spoke always leads back to its hub. Nothing in the arithmetic fixes the length: it is one constant, and the question is what a hub is for'
  - id: p-period-place
    type: sticky
    updated: [2026-11-15T13:48:02.000Z, agent:cube]
    box: [7798, 2350, 380, yellow]
    icon: 🤝
    text: 'An hour or longer: a hub is a place. Two who step in within one period land in the same spoke, so strangers meet by chance, and a hub has a timetable worth learning. A shared URL meets in any period, since it names the period'
  - id: p-period-ride
    type: sticky
    updated: [2026-11-15T13:48:03.000Z, agent:cube]
    box: [7798, 2545, 380, yellow]
    icon: 🎡
    text: 'Minutes: a hub is a ride. Wait a minute and the door leads elsewhere; with the far room seen through it (p-look-scale), standing at a hub is flipping channels. The cost: you pick where you go by waiting, and meeting by chance needs the same minute'
  - id: p-period-chase
    type: sticky
    updated: [2026-11-15T13:48:04.000Z, agent:cube]
    box: [7798, 2765, 380, yellow]
    icon: 🏃
    text: 'Vova, at minutes: a chase between worlds. The chased steps in during a period’s last seconds, and the chaser has those seconds or loses the trail, the changed room in the doorway saying so. Or an ambush: the spoke the chased took leads back only to this hub'
  - id: p-period-clock
    type: sticky
    updated: [2026-11-15T14:00:39.000Z, agent:cube]
    box: [7798, 2985, 380, purple]
    icon: ⏳
    text: 'The clock is already on everyone’s wrist, Vova: if every hub flips on the minute, a watch with a second hand is all the timing a chase needs. An offset rolled per hub, so the world does not flip all at once, takes that away, and then the door itself must show its countdown'
  - id: p-period-lottery
    type: sticky
    updated: [2026-11-15T13:48:06.000Z, agent:cube]
    box: [7798, 3180, 380, purple]
    icon: 🎲
    text: 'Lottery or timetable: a fresh roll each period repeats, and a floor-6 hub at an hour shows all its 182 spokes in ~44 days; a shuffled cycle shows each once in 182 periods and still looks random'
  - id: p-period-see
    type: sticky
    updated: [2026-11-15T13:48:07.000Z, agent:cube]
    box: [7798, 3355, 380, gray]
    icon: 👥
    text: 'Meeting and chasing both need to see the other player, and the cube has no channel for it: the site is static, and the world is shared only as a function. Presence is a fork of its own, outside portals'
  - id: p-lift-q
    type: sticky
    updated: [2026-11-15T14:05:58.000Z, agent:cube]
    box: [5748, 3660, 380, blue]
    icon: 🛗
    text: 'Vova: the portal as a lift. Shut, an ordinary door; opened, a plain cabin whose display names the floor it goes to. Mundane sci-fi: you shrink inside a cabin that shrinks with you, so the change of size needs no playing out. And elevator music on the way'
  - id: p-lift-music
    type: sticky
    updated: [2026-11-15T14:05:59.000Z, agent:cube]
    box: [6158, 3660, 380, yellow]
    icon: 🎵
    text: 'Music as the speedometer. At ~0.1 s a floor a ride is too short for a tune, but a lift may take longer: thirty floors, half a minute of a silly melody, a semitone lower each floor, so going deeper sinks into the bass. The cube already has sound (features/sound), so no new system'
  - id: p-lift-number
    type: sticky
    updated: [2026-11-15T14:06:00.000Z, agent:cube]
    box: [6568, 3660, 380, yellow]
    icon: 🔢
    text: 'Is the floor on the display a spoiler? It puts in the world a fact the world did not show, which spoiler-free trophies guard against. But the URL already names the floor, so the display tells nothing the player lacks: fine'
  - id: p-go-q
    type: sticky
    updated: [2026-11-15T19:30:00.000Z, agent:cube]
    box: [5748, 3900, 380, blue]
    icon: 🛠️
    text: 'Decided, 15 Nov: what the first build of portals is. Everything above that this row does not settle stays open'
  - id: p-go-net
    type: sticky
    updated: [2026-11-15T19:30:01.000Z, agent:cube]
    box: [6158, 3900, 380, green]
    icon: ⚖️
    text: 'The fair network. A spoke climbs one floor 3 times in 4 because each floor holds four times the hubs above it; a hub drops by the mirror of that, one floor at weight 1, two at ¼, three at 1/16. The hub share is the one at which a portal opened at random moves you down as far as up: ½ on floors 8–64, derived, no number set by hand'
  - id: p-go-minute
    type: sticky
    updated: [2026-11-15T19:30:02.000Z, agent:cube]
    box: [6568, 3900, 380, green]
    icon: ⏱️
    text: 'The period is a minute, one tick for every hub: a hub is a ride, and a watch’s second hand is its timetable'
  - id: p-go-door
    type: sticky
    updated: [2026-11-15T19:30:03.000Z, agent:cube]
    box: [6978, 3900, 380, green]
    icon: 🚪
    text: 'No lift. A portal is an ordinary door; opened, it shows the far floor as you will see it once through. When the minute turns, the view through an open hub door turns with it'
  - id: p-go-lock
    type: sticky
    updated: [2026-11-15T19:58:00.000Z, agent:cube]
    box: [7798, 3900, 380, purple]
    icon: 🔒
    text: 'To think about, not now. Vova: “some temporary lock, or another mechanism, after you go through a door, so you cannot step straight back.” Today the way back is always open after a descent (a spoke is fixed to its hub) and within the minute after a climb'
  - id: p-go-air
    type: sticky
    updated: [2026-11-15T19:46:00.000Z, agent:cube]
    box: [7388, 3900, 380, green]
    icon: 🌫️
    text: 'Air, lens included: the far floor is drawn in the air, haze and lens of the floor you leave, not its own, so a glitchy floor looks ordinary until you step in. Vova: “just what we need”'
  - id: l-go-period
    type: line
