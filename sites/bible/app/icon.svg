<!--
  The Agentic Bible's mark: a wax seal, in two cuts — this one and `seal-lettered.svg`.
  The two are one drawing; the lettered cut is this file plus a final letters
  path, which is what lets the home page's hover fade the lettering off rather
  than cross into a different image.

  Drawn rather than traced, so the shape is re-derivable from these numbers:
  a 1024 canvas, wax radius 418 with three harmonics on it
  (0.030·sin(11θ+0.7) + 0.016·sin(7θ+2.1) + 0.012·sin(3θ+4)), sampled 96 times
  and smoothed Catmull-Rom; the same outline twice more, offset (+11,+13) dark
  and (-10,-12) light under the body, which is what makes the wax read as wax;
  an engraved ring at 372; and twelve round-capped spokes from radius 14
  outward, lengths varying ±7%.
-->
