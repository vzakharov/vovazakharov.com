<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 530" width="980" height="530" role="img" aria-labelledby="ttl desc">
<title id="ttl">Cumulative commits to main during the Playgram Bubble-to-Next.js rebuild</title>
<desc id="desc">A cumulative commit curve over 168 days, from the first commit on 6 March 2026 to 1,537 commits on 20 August 2026. The slope is 6.8 commits per day through the March and April grind and 11.1 per day from 26 May, when the work moved to parallel cloud agents and a pull-request flow. The two-month deadline on 6 May passes with nothing in production. Release milestones are marked: 4.0.0, the first production build, on 21 May; 4.1.0, the first workspace live, on 24 June; 4.2.0, the big cutover, on 3 July; and 4.3.0, all workspaces, on 11 July.</desc>
