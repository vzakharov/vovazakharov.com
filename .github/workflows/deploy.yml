name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Only a feat: or fix: subject reaches production; anything else lands on main
  # without publishing. `workflow_dispatch` bypasses the gate, so a chore: that
  # does change the built site is deployed by running this workflow by hand.
  gate:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.subjects.outputs.deploy }}
    steps:
      - name: 'Scan the pushed subjects for feat:/fix:'
        id: subjects
        env:
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" != 'push' ]; then
            subjects=''
            deploy=true
            verdict='Manual run — deploying regardless of commit subjects.'
          else
            # Subject lines only: a body that happens to mention "fix:" is not a fix.
            subjects=$(jq -r '.[].message | split("\n")[0]' <<< "$COMMITS")

            if grep -qE '^(feat|fix)(\([^)]+\))?!?:' <<< "$subjects"; then
              deploy=true
              verdict='Deploying — a feat:/fix: subject is in this push.'
            else
              deploy=false
              verdict='Skipping the deploy — no feat:/fix: subject in this push.'
            fi
          fi

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

          {
            echo "$verdict"
            if [ -n "$subjects" ]; then
              echo
              echo 'Pushed subjects:'
              sed 's/^/- /' <<< "$subjects"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
