name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # scripts/deploy-gate.sh carries which subjects publish which site, and is
  # runnable against a branch's own log.
  gate:
    runs-on: ubuntu-latest
    outputs:
      vova: ${{ steps.subjects.outputs.vova }}
      lsa: ${{ steps.subjects.outputs.lsa }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 'Scan the pushed subjects for feat:/fix:'
        id: subjects
        env:
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: ./scripts/deploy-gate.sh

  build-vova:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.vova == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:vova

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/vova/out

  deploy-vova:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-vova
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The second site has no Pages site of its own here — a repository gets one —
  # so it is built here and pushed to the repository that serves it.
  # scripts/publish-lsa.sh carries the credential's contract.
  publish-lsa:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.lsa == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:lsa

      - name: Publish to the receiving repository
        env:
          LSA_PAGES_DEPLOY_KEY: ${{ secrets.LSA_PAGES_DEPLOY_KEY }}
        run: ./scripts/publish-lsa.sh
