name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      site:
        # Free text rather than a `choice`, which is single-select: with three
        # sites the useful runs include the pairs, and a `choice` would need
        # one option per subset.
        description: Which sites this run publishes — `all`, or a list of `vova`, `lsa`, `bible`
        type: string
        default: all

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Which subject publishes which site is CLAUDE.md § Deployment. No checkout
  # step: this job reads the push event and never the tree.
  gate:
    runs-on: ubuntu-latest
    outputs:
      vova: ${{ steps.subjects.outputs.vova }}
      receivers: ${{ steps.subjects.outputs.receivers }}
    steps:
      - name: 'Scan the pushed subjects for feat:/fix:'
        id: subjects
        env:
          COMMITS: ${{ toJSON(github.event.commits) }}
          SITE: ${{ inputs.site }}
        run: |
          set -euo pipefail

          vova=false
          receivers=''
          subjects=''

          # A site name selects that site; anything else — an unscoped subject,
          # a scope naming none of them, the picker's own `all` — selects all of
          # them. `vova` is tracked
          # apart from the rest because it leaves by a different door: it is this
          # repository's own Pages site, and the others are force-pushed.
          select_site() {
            case "$1" in
              vova) vova=true ;;
              lsa | bible) receivers="$receivers $1" ;;
              *)
                vova=true
                receivers="$receivers lsa bible"
                ;;
            esac
          }

          # The picker names its sites outright, so an unrecognized one is a
          # typo rather than the "anything else" a commit scope legitimately is
          # — and falling through to `select_site` would publish everything.
          select_picked() {
            case "$1" in
              all | vova | lsa | bible) select_site "$1" ;;
              *)
                echo "Unknown site '$1' — expected \`all\`, or a list of \`vova\`, \`lsa\`, \`bible\`." >&2
                exit 1
                ;;
            esac
          }

          if [ "$GITHUB_EVENT_NAME" != 'push' ]; then
            # No subject to read a scope off, so the picker stands in for one.
            # Unquoted on purpose: the field is a list, split on either
            # separator a person writing one reaches for.
            for picked in $(tr ',' ' ' <<< "${SITE:-all}"); do
              select_picked "$picked"
            done
            verdict="Manual run — vovazakharov.com: $vova, receivers:$receivers."
          else
            # Subject lines only: a body that happens to mention "fix:" is not a fix.
            subjects=$(jq -r '.[].message | split("\n")[0]' <<< "$COMMITS")

            while IFS= read -r subject; do
              [ -n "$subject" ] || continue

              grep -qE '^(feat|fix)(\([^)]+\))?!?:' <<< "$subject" || continue
              scope=$(sed -nE 's/^(feat|fix)(\(([^)]+)\))?!?:.*/\3/p' <<< "$subject")

              select_site "$scope"
            done <<< "$subjects"

            if [ "$vova" = true ] || [ -n "$receivers" ]; then
              verdict="Deploying — vovazakharov.com: $vova, receivers:$receivers."
            else
              verdict='Skipping the deploy — no feat:/fix: subject in this push.'
            fi
          fi

          # The publish job's matrix, one entry per receiving site: its id, and
          # the name of the secret holding that receiver's deploy key. Naming
          # the secret here is what keeps publish-site.sh reading one fixed
          # variable, so a new receiver is an entry in its `case` and nothing
          # in its key handling.
          receivers_json=$(
            tr ' ' '\n' <<< "$receivers" \
              | sort -u \
              | jq -R -s -c '
                  split("\n")
                    | map(select(length > 0))
                    | map({ site: ., secret: (ascii_upcase + "_PAGES_DEPLOY_KEY") })
                '
          )

          {
            echo "vova=$vova"
            echo "receivers=$receivers_json"
          } >> "$GITHUB_OUTPUT"

          {
            echo "$verdict"
            if [ -n "$subjects" ]; then
              echo
              echo 'Pushed subjects:'
              sed 's/^/- /' <<< "$subjects"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  build-vova:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.vova == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:vova

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/vova/out

  deploy-vova:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-vova
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # A repository gets one Pages site, which vova holds, so every other site is
  # built here and force-pushed to the repository that serves it.
  # scripts/publish-site.sh carries the credential's contract.
  #
  # The matrix is built from the gate's output rather than filtered by a
  # job-level `if` over a static one: `matrix` is not in scope in a job-level
  # `if`, which is read before the matrix expands. The job is skipped whole
  # when nothing is selected, an empty matrix being an error rather than a
  # no-op. `fail-fast: false` so one receiver's failure leaves the others
  # published rather than cancelled.
  publish:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.receivers != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.receivers) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:${{ matrix.site }}

      - name: Publish to the receiving repository
        env:
          PAGES_DEPLOY_KEY: ${{ secrets[matrix.secret] }}
        run: ./scripts/publish-site.sh ${{ matrix.site }}
