name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      site:
        description: Which site this run publishes
        type: choice
        options: [both, vova, lsa]
        default: both

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Which subject publishes which site is CLAUDE.md § Deployment. No checkout
  # step: this job reads the push event and never the tree.
  gate:
    runs-on: ubuntu-latest
    outputs:
      vova: ${{ steps.subjects.outputs.vova }}
      lsa: ${{ steps.subjects.outputs.lsa }}
    steps:
      - name: 'Scan the pushed subjects for feat:/fix:'
        id: subjects
        env:
          COMMITS: ${{ toJSON(github.event.commits) }}
          SITE: ${{ inputs.site }}
        run: |
          set -euo pipefail

          vova=false
          lsa=false
          subjects=''

          # A site name selects that site; anything else — an unscoped subject,
          # a scope naming neither — selects both.
          select_site() {
            case "$1" in
              vova) vova=true ;;
              lsa) lsa=true ;;
              *) vova=true; lsa=true ;;
            esac
          }

          if [ "$GITHUB_EVENT_NAME" != 'push' ]; then
            # No subject to read a scope off, so the picker stands in for one.
            select_site "${SITE:-both}"
            verdict="Manual run — vovazakharov.com: $vova, latestageagentic.com: $lsa."
          else
            # Subject lines only: a body that happens to mention "fix:" is not a fix.
            subjects=$(jq -r '.[].message | split("\n")[0]' <<< "$COMMITS")

            while IFS= read -r subject; do
              [ -n "$subject" ] || continue

              grep -qE '^(feat|fix)(\([^)]+\))?!?:' <<< "$subject" || continue
              scope=$(sed -nE 's/^(feat|fix)(\(([^)]+)\))?!?:.*/\3/p' <<< "$subject")

              select_site "$scope"
            done <<< "$subjects"

            if [ "$vova" = true ] || [ "$lsa" = true ]; then
              verdict="Deploying — vovazakharov.com: $vova, latestageagentic.com: $lsa."
            else
              verdict='Skipping the deploy — no feat:/fix: subject in this push.'
            fi
          fi

          {
            echo "vova=$vova"
            echo "lsa=$lsa"
          } >> "$GITHUB_OUTPUT"

          {
            echo "$verdict"
            if [ -n "$subjects" ]; then
              echo
              echo 'Pushed subjects:'
              sed 's/^/- /' <<< "$subjects"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  build-vova:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.vova == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:vova

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/vova/out

  deploy-vova:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-vova
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The second site has no Pages site of its own here — a repository gets one —
  # so it is built here and pushed to the repository that serves it.
  # scripts/publish-lsa.sh carries the credential's contract.
  publish-lsa:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.lsa == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:lsa

      - name: Publish to the receiving repository
        env:
          LSA_PAGES_DEPLOY_KEY: ${{ secrets.LSA_PAGES_DEPLOY_KEY }}
        run: ./scripts/publish-lsa.sh
