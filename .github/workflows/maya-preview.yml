name: Publish Майя's preview

# Майя's site from every push to one of her branches to
# preview.maya.vovazakharov.com, so the operator follows her unmerged work
# without a dev server. A slot of her own, so it never overwrites a preview
# dispatched through preview.yml, whose steps these are.

on:
  push:
    branches: ['claude/maya-*']

permissions:
  contents: read

# Only the latest push is worth serving.
concurrency:
  group: 'maya-preview'
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build
        run: pnpm build:maya

      - name: Render page PDFs
        uses: ./.github/actions/render-pdfs
        with:
          site: maya

      - name: Publish to her preview slot
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.MAYA_PREVIEW_PAGES_DEPLOY_KEY }}
          PREVIEW_HOST: preview.maya.vovazakharov.com
        run: ./scripts/publish-site.sh maya --preview
