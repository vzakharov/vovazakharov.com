name: Vet

# Run by hand on a branch — `gh workflow run vet.yml --ref <branch>` — in place
# of a local `./scripts/vet.sh`, never on its own. The same run, split across
# machines by vet.sh's own phases: the four builds side by side with the checks
# no build feeds, then ESLint in shards beside the checks that read the builds'
# output.
on:
  workflow_dispatch:

permissions:
  contents: read

# A second dispatch on the same branch means the first one's head is stale.
concurrency:
  group: vet-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [vova, lsa, bible, basilisk]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build
        run: ./scripts/vet.sh build ${{ matrix.site }}

      # Two artifacts, because the lint shards need only the generated route
      # types, a few kilobytes, where the export is tens of megabytes.
      # `.next` is a hidden directory, which upload-artifact skips unasked.
      - name: Upload the route types
        uses: actions/upload-artifact@v4
        with:
          name: types-${{ matrix.site }}
          path: apps/${{ matrix.site }}/.next/types
          include-hidden-files: true
          retention-days: 1

      - name: Upload the export
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.site }}
          path: apps/${{ matrix.site }}/out
          retention-days: 1

  lint:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Download the route types
        uses: actions/download-artifact@v4
        with:
          pattern: types-*
          path: tmp/artifacts

      - name: Place the route types
        run: ./.github/scripts/place-vet-artifacts.sh

      - name: ESLint, shard ${{ matrix.shard }}
        run: ./scripts/vet.sh lint ${{ matrix.shard }}

  built:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Download the builds
        uses: actions/download-artifact@v4
        with:
          path: tmp/artifacts

      - name: Place the builds
        run: ./.github/scripts/place-vet-artifacts.sh

      - name: Checks over the builds
        run: ./scripts/vet.sh built

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vet-logs-built
          path: tmp/run-parallel/
          retention-days: 14

  # Starts with the builds rather than after them: nothing it runs reads one.
  source:
    runs-on: ubuntu-latest
    steps:
      # Full history rather than the default single commit: checks that diff
      # against `origin/main` pass quietly with no base to read.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain

      # The runner's system Python refuses a pip install (PEP 668), and
      # scripts/song-intake/test_song_facts.py needs numpy.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numpy
        run: python -m pip install numpy

      # The tests that build throwaway repositories commit into them.
      - name: Set a git identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Checks over the source
        run: ./scripts/vet.sh source

      # vet.sh prints only what failed, and several checks pass quietly when
      # they had nothing to read, so a green run is checked by its logs.
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vet-logs-source
          path: |
            tmp/run-parallel/
            tmp/vet-*.log
          retention-days: 14
