name: Vet

# The pre-merge signal: scripts/vet.sh on one known machine, run when a PR
# leaves draft — at /finalize, which waits on this run — and on dispatch, for a
# head that moved after that. No `synchronize`: a draft takes dozens of pushes
# an hour, and a trigger GitHub matches creates a run before any job-level `if`
# can skip it, so each push would leave a skipped run in the Actions list.
on:
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vet-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# One job rather than a build per site feeding sharded checks: sharding saved
# under a minute on average and added six jobs, each paying a checkout whose
# time varies by minutes (#190).
jobs:
  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: scripts/lib/changed-files.sh and the squash, estimates and
      # CLAUDE.md-size checks diff against the merge base with origin/main,
      # which a shallow clone does not have.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Vet
        run: ./scripts/vet.sh
