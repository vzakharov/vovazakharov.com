name: Vet

# The pre-merge signal: scripts/vet.sh on one known machine. A draft runs
# nothing — plans and work in flight live there, and a PR leaves draft at
# /finalize, which waits on this run.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: vet-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# One job rather than a build per site feeding sharded checks: sharding saved
# under a minute on average and added six jobs, each paying a checkout whose
# time varies by minutes (#190).
jobs:
  vet:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: scripts/lib/changed-files.sh and the squash, estimates and
      # CLAUDE.md-size checks diff against the merge base with origin/main,
      # which a shallow clone does not have.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Vet
        run: ./scripts/vet.sh
